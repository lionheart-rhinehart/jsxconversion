<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreativeEngine — Editor (portable host)</title>
<!-- PORTABILITY PROOF (Phase-2 check 2.2): this is a *bare* host. It pulls in only
     the three editor files by relative path + a tagged design over fetch. No build
     step, no framework, no project-internal import. The same three files mount
     unchanged inside the Kraken portal — only this host page differs. -->
<link rel="stylesheet" href="editor.css">
<style>html,body{margin:0;height:100%;background:#08090b;}</style>
</head>
<body>
<div id="host" style="position:fixed;inset:0;"></div>
<!-- one-click on-ramp to the approval→render→library pipeline (only in package mode).
     Top-LEFT so it never covers the editor's top-right toolbar (Undo/Redo/Save). It SAVES
     the current edits first, then opens the pipeline page — so "send" can never ship stale work. -->
<button id="ce-pipeline-btn" style="display:none;position:fixed;top:10px;left:12px;z-index:99998;
   background:#c4141d;color:#fff;border:none;cursor:pointer;font:600 13px system-ui,sans-serif;
   padding:8px 14px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.45);">💾 Save &amp; Send to approval ▸</button>
<script type="module">
  import { mountEditor } from './editor.js';

  // the design to edit + the media library for the swap bar are passed by the host.
  // ?html=  overrides the default tagged design path (raw file).
  // ?pkg=<slug>  loads a packaged export: fetch its intake.json (written by the intake
  //   packager, #2) and use the manifest's entryHtml + asset_base. This is the "drop any
  //   export in and go" front door — the manifest is the single source of truth for WHERE
  //   the design lives and WHAT its asset base is, shared with the renderer + Kraken.
  const params = new URLSearchParams(location.search);
  let htmlPath = params.get('html') || '../../campaigns/westfield-100-off/index.tagged.html';
  let pkgBaseHref = null;
  const pkg = params.get('pkg');
  if (pkg) {
    const manifestUrl = '/creative-engine/intake/_packages/' + encodeURIComponent(pkg) + '/intake.json';
    const manifest = await (await fetch(manifestUrl)).json();
    // asset_base is repo-rooted + origin-absolute ("/creative-engine/intake/_packages/<slug>/<dir>/").
    // entryHtml is relative to the package root; join it onto asset_base's package root.
    pkgBaseHref = manifest.asset_base;
    htmlPath = pkgBaseHref + manifest.entryHtml.split('/').pop();
  }

  // B2 — restore previously-saved edits: a package may carry overrides.json (written by a
  // prior Save). Load it so reopening the package shows your edits instead of a blank slate.
  let initialOverrides = {};
  if (pkg) {
    try {
      const saved = await (await fetch(pkgBaseHref + 'overrides.json', { cache: 'no-store' })).json();
      if (saved && typeof saved === 'object') initialOverrides = saved;
    } catch { /* no saved edits yet — fine */ }
  }

  // apply-overrides.js is the SHARED replay function. The host loads its source once
  // and hands it to the editor, which injects the very same source into the design
  // iframe (and the renderer injects the very same file headless) → preview == MP4.
  const applySrc = await (await fetch('./apply-overrides.js')).text();
  window.__CE_APPLY_SRC__ = applySrc;
  // also evaluate it here so window.CEApply exists in the host (not strictly needed)
  new Function(applySrc)();

  // RUNTIME RE-TAG tools (zero-loss v2). A real Claude Design export is JS-driven: the
  // design's own scripts BUILD (and on reload REBUILD) the frames at runtime, wiping any
  // static tags. So the editor stamps data-edit-* ids on the LIVE DOM *after* the build,
  // using the SAME shared modules the renderer injects → identical ids → an edit lands on
  // the same element in the editor preview and the rendered MP4. raf-clock.js is the
  // renderer's deterministic freeze clock and is DELIBERATELY NOT loaded here — the live
  // editor must animate freely.
  window.__CE_FRAME_DETECT_SRC__ = await (await fetch('../shared/frame-detect.js')).text();
  window.__CE_RETAG_SRC__ = await (await fetch('../shared/runtime-retag.js')).text();

  const html = await (await fetch(htmlPath)).text();
  // the design's own folder — so its relative asset paths resolve inside the iframe. For a
  // packaged export this is the manifest's asset_base verbatim (repo-rooted, origin-absolute);
  // otherwise derive it from the html path's folder.
  const baseHref = pkgBaseHref || new URL(htmlPath, location.href).href.replace(/[^/]*$/, '');

  // demo media library (Phase-3 manifest will feed this for real). Paths are ORIGIN-
  // ABSOLUTE ("/campaigns/…") so they resolve correctly both in the host page AND when
  // the driver/swap sets them on a <video> INSIDE the iframe (whose <base> is the
  // campaign folder — a host-relative "../../" path would resolve wrong there).
  const mediaLibrary = [
    { src: '/campaigns/westfield-100-off/assets/vid/ad1.mp4', type: 'video', label: 'ad1 footage' },
    { src: '/campaigns/westfield-100-off/assets/vid/ad2.mp4', type: 'video', label: 'ad2 footage' },
    { src: '/campaigns/westfield-100-off/assets/vid/ad3.mp4', type: 'video', label: 'ad3 footage' },
  ];

  // LIVE Kraken bridge (Phase C). These hit the serve.mjs /kraken/* routes on the same
  // origin. When this page is opened WITHOUT serve.mjs (file://, or a static host with
  // no /kraken routes), the fetch fails / returns available:false → the editor hides the
  // Kraken UI and the static library still works. Same degradation as missing creds (F6).
  async function kfetch(p, opts) {
    const r = await fetch(p, opts);
    return r.json();   // routes always answer 200 JSON; a network error throws → caught by editor
  }
  const remoteBrowse = {
    workspaces: () => kfetch('/kraken/workspaces'),
    folders: (ws) => kfetch('/kraken/folders?ws=' + encodeURIComponent(ws)),
    files: (ws, folder) => kfetch('/kraken/files?ws=' + encodeURIComponent(ws) + '&folder=' + encodeURIComponent(folder || '')),
    pull: (payload) => kfetch('/kraken/pull', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) }),
    // 🔒 Lock: remember a workspace/folder as this design's default (keyed by htmlPath).
    getPin: () => kfetch('/kraken/pin?design=' + encodeURIComponent(htmlPath)),
    setPin: (pin) => kfetch('/kraken/pin', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ design: htmlPath, pin }) }),
  };

  // LIVE audio bridge — /audio/* on the same origin (serve.mjs). Degrades to an empty list
  // when there's no server (the paste-path box still works).
  const audioProvider = {
    list: () => kfetch('/audio/list'),
    upload: async (file) => {
      const r = await fetch('/audio/upload?name=' + encodeURIComponent(file.name), { method: 'POST', headers: { 'content-type': file.type || 'application/octet-stream' }, body: file });
      return r.json();
    },
  };

  const ed = mountEditor({
    container: document.getElementById('host'),
    html,
    baseHref,
    permissions: params.get('view') ? 'view' : 'edit',
    mediaProvider: { staticLibrary: mediaLibrary, remoteBrowse },
    audioProvider,
    overrides: initialOverrides,                      // B2 — restore prior Save
    onChange(overrides, meta) {
      window.__CE_OVERRIDES__ = overrides;            // exposed for the evidence harness
      // EDIT-LANE TRANSPORT (Phase 4, iframe-by-URL): when this page is iframed by Kraken's
      // approval portal, hand every change OUT to the parent so Kraken can persist the override
      // bag to the approval row (see docs/kraken-editor-mount-handoff.md → "Persist overrides").
      // Fires ONLY when actually embedded; standalone use (window.parent === window) is unaffected.
      if (window.parent && window.parent !== window) {
        // origin '*' here; Kraken pins event.origin to the editor's host on its side.
        window.parent.postMessage({ type: 'ce-overrides', overrides, meta: meta || null }, '*');
      }
      // B1 — Save PERSISTS the bag into the package (overrides.json) so it survives reloads
      // AND publish can carry it downstream. NO render happens here — this is pure data save.
      // When there's no package/server (file://), fall back to the old JSON download.
      if (meta && meta.save) {
        if (pkg) {
          fetch('/package/overrides?pkg=' + encodeURIComponent(pkg), {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ overrides }),
          }).then((r) => r.json()).then((r) => {
            toast(r && r.ok ? '✓ Saved' : ('Save failed: ' + ((r && r.error) || '?')));
          }).catch((e) => toast('Save failed: ' + e.message));
        } else {
          const blob = new Blob([JSON.stringify(overrides, null, 2)], { type: 'application/json' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
          a.download = 'overrides.json'; a.click();
          toast('Downloaded overrides.json');
        }
      }
    },
  });

  // Pipeline on-ramp: in package mode, reveal the button. Clicking it SAVES the current
  // edits (the exact same persist the Save button does) and THEN opens the pipeline page —
  // so the design you send is always the design you just edited (no stale/unsaved gap).
  if (pkg) {
    const pb = document.getElementById('ce-pipeline-btn');
    if (pb) {
      pb.style.display = 'block';
      pb.addEventListener('click', async () => {
        pb.disabled = true; const label = pb.textContent;
        try {
          const ov = (window.__CE_EDITOR__ && window.__CE_EDITOR__.getOverrides) ? window.__CE_EDITOR__.getOverrides() : (window.__CE_OVERRIDES__ || {});
          const r = await fetch('/package/overrides?pkg=' + encodeURIComponent(pkg), {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ overrides: ov }),
          }).then((x) => x.json());
          if (!r || !r.ok) { toast('Save failed: ' + ((r && r.error) || '?')); pb.disabled = false; pb.textContent = label; return; }
          toast('✓ Saved — opening the pipeline…');
          window.open('pipeline.html?pkg=' + encodeURIComponent(pkg), '_blank');
        } catch (e) { toast('Save failed: ' + e.message); }
        pb.disabled = false; pb.textContent = label;
      });
    }
  }

  // tiny transient confirmation toast (bottom-center) — so Save gives visible feedback.
  function toast(msg) {
    let t = document.getElementById('ce-host-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'ce-host-toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99999;' +
        'background:#0c0d10;color:#fff;border:1px solid #2a2c31;border-radius:8px;padding:8px 14px;' +
        'font:13px/1.2 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .15s;';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; }, 2200);
  }
  window.__CE_EDITOR__ = ed;
</script>
</body>
</html>
