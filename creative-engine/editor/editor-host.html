<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreativeEngine — Editor (portable host)</title>
<!-- PORTABILITY PROOF (Phase-2 check 2.2): this is a *bare* host. It pulls in only
     the three editor files by relative path + a tagged design over fetch. No build
     step, no framework, no project-internal import. The same three files mount
     unchanged inside the Kraken portal — only this host page differs. -->
<link rel="stylesheet" href="editor.css">
<style>html,body{margin:0;height:100%;background:#08090b;}</style>
</head>
<body>
<div id="host" style="position:fixed;inset:0;"></div>
<script type="module">
  import { mountEditor } from './editor.js';

  // the design to edit + the media library for the swap bar are passed by the host.
  // ?html= overrides the default tagged design path.
  const params = new URLSearchParams(location.search);
  const htmlPath = params.get('html') || '../../campaigns/westfield-100-off/index.tagged.html';

  // apply-overrides.js is the SHARED replay function. The host loads its source once
  // and hands it to the editor, which injects the very same source into the design
  // iframe (and the renderer injects the very same file headless) → preview == MP4.
  const applySrc = await (await fetch('./apply-overrides.js')).text();
  window.__CE_APPLY_SRC__ = applySrc;
  // also evaluate it here so window.CEApply exists in the host (not strictly needed)
  new Function(applySrc)();

  const html = await (await fetch(htmlPath)).text();
  // the design's own folder — so its relative asset paths resolve inside the iframe
  const baseHref = new URL(htmlPath, location.href).href.replace(/[^/]*$/, '');

  // demo media library (Phase-3 manifest will feed this for real). Paths are ORIGIN-
  // ABSOLUTE ("/campaigns/…") so they resolve correctly both in the host page AND when
  // the driver/swap sets them on a <video> INSIDE the iframe (whose <base> is the
  // campaign folder — a host-relative "../../" path would resolve wrong there).
  const mediaLibrary = [
    { src: '/campaigns/westfield-100-off/assets/vid/ad1.mp4', type: 'video', label: 'ad1 footage' },
    { src: '/campaigns/westfield-100-off/assets/vid/ad2.mp4', type: 'video', label: 'ad2 footage' },
    { src: '/campaigns/westfield-100-off/assets/vid/ad3.mp4', type: 'video', label: 'ad3 footage' },
  ];

  // LIVE Kraken bridge (Phase C). These hit the serve.mjs /kraken/* routes on the same
  // origin. When this page is opened WITHOUT serve.mjs (file://, or a static host with
  // no /kraken routes), the fetch fails / returns available:false → the editor hides the
  // Kraken UI and the static library still works. Same degradation as missing creds (F6).
  async function kfetch(p, opts) {
    const r = await fetch(p, opts);
    return r.json();   // routes always answer 200 JSON; a network error throws → caught by editor
  }
  const remoteBrowse = {
    workspaces: () => kfetch('/kraken/workspaces'),
    folders: (ws) => kfetch('/kraken/folders?ws=' + encodeURIComponent(ws)),
    files: (ws, folder) => kfetch('/kraken/files?ws=' + encodeURIComponent(ws) + '&folder=' + encodeURIComponent(folder || '')),
    pull: (payload) => kfetch('/kraken/pull', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) }),
    // 🔒 Lock: remember a workspace/folder as this design's default (keyed by htmlPath).
    getPin: () => kfetch('/kraken/pin?design=' + encodeURIComponent(htmlPath)),
    setPin: (pin) => kfetch('/kraken/pin', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ design: htmlPath, pin }) }),
  };

  // LIVE audio bridge — /audio/* on the same origin (serve.mjs). Degrades to an empty list
  // when there's no server (the paste-path box still works).
  const audioProvider = {
    list: () => kfetch('/audio/list'),
    upload: async (file) => {
      const r = await fetch('/audio/upload?name=' + encodeURIComponent(file.name), { method: 'POST', headers: { 'content-type': file.type || 'application/octet-stream' }, body: file });
      return r.json();
    },
  };

  const ed = mountEditor({
    container: document.getElementById('host'),
    html,
    baseHref,
    permissions: params.get('view') ? 'view' : 'edit',
    mediaProvider: { staticLibrary: mediaLibrary, remoteBrowse },
    audioProvider,
    onChange(overrides, meta) {
      window.__CE_OVERRIDES__ = overrides;            // exposed for the evidence harness
      // EDIT-LANE TRANSPORT (Phase 4, iframe-by-URL): when this page is iframed by Kraken's
      // approval portal, hand every change OUT to the parent so Kraken can persist the override
      // bag to the approval row (see docs/kraken-editor-mount-handoff.md → "Persist overrides").
      // Fires ONLY when actually embedded; standalone use (window.parent === window) is unaffected.
      if (window.parent && window.parent !== window) {
        // origin '*' here; Kraken pins event.origin to the editor's host on its side.
        window.parent.postMessage({ type: 'ce-overrides', overrides, meta: meta || null }, '*');
      }
      if (meta && meta.save) {
        const blob = new Blob([JSON.stringify(overrides, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = 'overrides.json'; a.click();
      }
    },
  });
  window.__CE_EDITOR__ = ed;
</script>
</body>
</html>
