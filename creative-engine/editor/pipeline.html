<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreativeEngine — Pipeline</title>
<style>
  :root { --bg:#0b0c0f; --panel:#14161b; --line:#2a2d35; --text:#e7e9ee; --dim:#9aa0ac; --accent:#c4141d; --ok:#2f9e44; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:650; }
  .slug { color:var(--dim); font:12px ui-monospace,monospace; }
  .wrap { padding:18px 22px; }
  label.fld { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; }
  select,input,button { font:inherit; }
  select,input { background:#0c0d10; color:var(--text); border:1px solid var(--line); border-radius:7px; padding:7px 10px; }
  input.email { width:240px; } .folder { width:180px; }
  button { background:#1d2027; color:var(--text); border:1px solid var(--line); border-radius:7px; padding:7px 12px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#3a3f4a; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:14px 0; }
  .bar .sep { width:1px; height:24px; background:var(--line); }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--dim); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  td.sel,th.sel { width:34px; text-align:center; }
  .thumb { width:52px; height:92px; object-fit:cover; border-radius:5px; border:1px solid var(--line); background:#000; vertical-align:middle; }
  .fr { display:flex; align-items:center; gap:12px; }
  .fr .meta b { font-size:13px; } .fr .meta div { color:var(--dim); font-size:12px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .b-edited { color:#ffd43b; border-color:#7a6a1f; }
  .b-sent { color:#6ea8fe; border-color:#2b4b8f; }
  .b-approved { color:var(--ok); border-color:#235c34; }
  .b-rendered { color:#d8b4fe; border-color:#5a3a7a; }
  .row-actions { display:flex; gap:6px; }
  a.link { color:#6ea8fe; }
  .msg { margin:10px 0; padding:11px 13px; border:1px solid var(--line); border-radius:8px; background:var(--panel); white-space:pre-wrap; font:12px ui-monospace,monospace; max-height:240px; overflow:auto; display:none; }
  .empty { padding:40px 12px; color:var(--dim); text-align:center; }
  .foot { color:var(--dim); font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<header>
  <h1>Pipeline</h1><span class="slug" id="slug">…</span>
  <span style="flex:1"></span>
  <button id="refresh">↻ Refresh</button>
</header>
<div class="wrap">
  <div class="bar">
    <label class="fld">Destination workspace <select id="ws"><option value="">— pick —</option></select></label>
    <label class="fld">Folder <select class="folder" id="folder"><option value="">— no folder —</option></select></label>
    <label class="fld">Approver email <input class="email" id="email" placeholder="client@example.com"></label>
  </div>
  <div class="bar">
    <button id="sendSel" class="primary">📤 Send selected (<span id="selN">0</span>)</button>
    <button id="selEdited">Select edited</button>
    <button id="selAll">Select all</button>
    <button id="selNone">Clear</button>
    <span class="sep"></span>
    <button id="renderAll">▶ Render all approved</button>
    <button id="libAll">📁 Send all rendered to library</button>
  </div>
  <div class="msg" id="msg"></div>
  <table>
    <thead><tr><th class="sel"><input type="checkbox" id="checkAll"></th><th>Design</th><th>State</th><th>Review</th><th>Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none"></div>
  <div class="foot" id="foot"></div>
</div>
<script type="module">
  const params = new URLSearchParams(location.search);
  const pkg = params.get('pkg');
  const $ = (s) => document.querySelector(s);
  $('#slug').textContent = pkg || '(no pkg)';
  const msg = (t) => { const m = $('#msg'); m.style.display = 'block'; m.textContent = t; };
  const jget = (u) => fetch(u).then((r) => r.json());
  const jpost = (u, b) => fetch(u, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(b) }).then((r) => r.json());
  let FRAMES = [];

  async function loadWorkspaces() {
    try { const r = await jget('/kraken/workspaces');
      if (r && r.items) for (const w of r.items) { const o = document.createElement('option'); o.value = w.id; o.textContent = w.label || w.name; $('#ws').appendChild(o); }
    } catch {}
  }
  // Load the chosen workspace's folders into the Folder dropdown so a real
  // destination can be picked (fixes "the folder option never pulled up").
  async function loadFolders(wsId) {
    const sel = $('#folder');
    sel.innerHTML = '<option value="">— no folder —</option>';
    if (!wsId) return;
    try {
      const r = await jget('/kraken/folders?ws=' + encodeURIComponent(wsId));
      for (const f of (r && r.items) || []) { const o = document.createElement('option'); o.value = f.id; o.textContent = f.name; sel.appendChild(o); }
    } catch {}
    const nu = document.createElement('option'); nu.value = '__new__'; nu.textContent = '+ New folder…'; sel.appendChild(nu);
  }
  const dest = () => ({ wsId: $('#ws').value || null, folder: $('#folder').value.trim() || null, emails: $('#email').value.trim() ? [$('#email').value.trim()] : [] });
  const checked = () => [...document.querySelectorAll('.rowsel:checked')].map((c) => c.dataset.frame);
  const refreshSelN = () => { $('#selN').textContent = checked().length; };

  function badge(f) {
    const parts = [];
    if (f.edits > 0) parts.push('<span class="badge b-edited">Edited</span>');
    if (f.rendered) parts.push('<span class="badge b-rendered">Rendered</span>');
    else if (f.approved) parts.push('<span class="badge b-approved">Approved</span>');
    else if (f.sent) parts.push('<span class="badge b-sent">Sent</span>');
    if (!parts.length) parts.push('<span class="badge">—</span>');
    return parts.join(' ');
  }

  async function refresh() {
    let r;
    try { r = await jget('/package/status?pkg=' + encodeURIComponent(pkg)); }
    catch (e) { $('#empty').style.display = 'block'; $('#empty').textContent = 'Could not reach the pipeline server. Make sure the editor server is running the latest code (deploy, then open the editor on a fresh port).'; return; }
    if (!r || !r.ok) { $('#empty').style.display = 'block'; $('#empty').textContent = 'Status error: ' + ((r && r.error) || 'unknown') + '. The server may be running older code without the pipeline routes — redeploy + use a fresh port.'; return; }
    FRAMES = r.frames || [];
    $('#empty').style.display = FRAMES.length ? 'none' : 'block';
    if (!FRAMES.length) $('#empty').textContent = 'This package has no frames.';
    const tb = $('#rows'); tb.innerHTML = '';
    for (const f of FRAMES) {
      const tr = document.createElement('tr');
      const thumb = f.poster ? `<img class="thumb" src="${f.poster}" alt="">` : '<div class="thumb"></div>';
      tr.innerHTML = `<td class="sel"><input type="checkbox" class="rowsel" data-frame="${f.id}" ${f.edits>0?'checked':''}></td>
        <td><div class="fr">${thumb}<div class="meta"><b>${f.label || f.id}</b><div>${f.id}</div></div></div></td>
        <td>${badge(f)}</td>
        <td>${f.reviewUrl ? `<a class="link" href="${f.reviewUrl}" target="_blank">open ↗</a>` : '—'}</td>
        <td><div class="row-actions">
          <button data-act="send" data-frame="${f.id}">Send</button>
          <button data-act="render" data-ap="${f.approvalId||''}" ${f.approved?'':'disabled'}>Render</button>
          <button data-act="lib" ${f.rendered?'':'disabled'}>To library</button>
        </div></td>`;
      tb.appendChild(tr);
    }
    const edited = FRAMES.filter((f) => f.edits > 0).length;
    $('#foot').textContent = `${FRAMES.length} design(s) · ${edited} edited (auto-selected) · workspace ${r.wsId || '(unpublished)'} · render only after Approve in the portal`;
    refreshSelN();
  }

  async function publish(frameIds) {
    const d = dest();
    if (!d.wsId) return msg('Pick a destination workspace first.');
    if (!frameIds.length) return msg('Select at least one design (checkbox) to send.');
    const dry = await jpost('/package/publish', { pkg, frameIds, wsId:d.wsId, folderName:d.folder, emails:d.emails });
    if (!dry.ok) return msg('publish dry-run failed: ' + (dry.error || JSON.stringify(dry)));
    if (!confirm(`Send ${dry.frames.length} design(s) to approval in the selected workspace? This publishes live and creates review link(s).`)) return;
    const live = await jpost('/package/publish', { pkg, frameIds, wsId:d.wsId, folderName:d.folder, emails:d.emails, confirm:true });
    if (!live.ok) return msg('publish failed: ' + (live.error || ''));
    msg('✓ Sent ' + (live.reviewLinks||[]).length + ' design(s).\n' + (live.reviewLinks||[]).map((l)=>`${l.frame_id}: ${l.reviewUrl}`).join('\n'));
    refresh();
  }
  async function render(approvalId) { msg('Rendering… (pulls from cloud, may take a moment)'); const r = await jpost('/package/render', { pkg, approvalId: approvalId || null }); msg(r.ok ? ('✓ Rendered ' + (r.rendered||[]).length + ' file(s).') : ('render failed: ' + r.error)); refresh(); }
  async function toLibrary() {
    const d = dest();
    const dry = await jpost('/package/dispatch', { pkg, folder:d.folder, workspace:d.wsId });
    if (!dry.ok) return msg('dispatch dry-run failed: ' + dry.error);
    if (!confirm('File the rendered MP4(s) into the Content Library?')) return;
    const live = await jpost('/package/dispatch', { pkg, folder:d.folder, workspace:d.wsId, confirm:true });
    msg(live.ok ? '✓ Filed to library.' : ('dispatch failed: ' + live.error)); refresh();
  }

  $('#rows').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'send') publish([b.dataset.frame]);
    else if (b.dataset.act === 'render') render(b.dataset.ap);
    else if (b.dataset.act === 'lib') toLibrary();
  });
  $('#rows').addEventListener('change', (e) => { if (e.target.classList.contains('rowsel')) refreshSelN(); });
  const setAll = (v) => { document.querySelectorAll('.rowsel').forEach((c) => { c.checked = v; }); refreshSelN(); };
  $('#checkAll').addEventListener('change', (e) => setAll(e.target.checked));
  $('#selAll').addEventListener('click', () => setAll(true));
  $('#selNone').addEventListener('click', () => setAll(false));
  $('#selEdited').addEventListener('click', () => { document.querySelectorAll('.rowsel').forEach((c) => { const f = FRAMES.find((x) => x.id === c.dataset.frame); c.checked = !!(f && f.edits > 0); }); refreshSelN(); });
  $('#sendSel').addEventListener('click', () => publish(checked()));
  $('#renderAll').addEventListener('click', () => render(null));
  $('#libAll').addEventListener('click', () => toLibrary());
  $('#refresh').addEventListener('click', refresh);
  // When a workspace is picked, pull up its folders.
  $('#ws').addEventListener('change', () => loadFolders($('#ws').value));
  // "+ New folder…" → type a name; it's passed as folderName (created on publish, idempotent).
  $('#folder').addEventListener('change', (e) => {
    if (e.target.value !== '__new__') return;
    const name = (prompt('New folder name:') || '').trim();
    if (!name) { e.target.value = ''; return; }
    const o = document.createElement('option'); o.value = name; o.textContent = name + ' (new)';
    e.target.insertBefore(o, e.target.querySelector('option[value="__new__"]'));
    e.target.value = name;
  });

  await loadWorkspaces();
  await refresh();
</script>
</body>
</html>
