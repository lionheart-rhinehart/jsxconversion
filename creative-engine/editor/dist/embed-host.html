<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreativeEngine — embeddable editor bundle (Phase 4.1)</title>
<!-- PHASE 4.1 EMBED PROOF. This host imports exactly ONE file — the bundle — and
     nothing else: no editor.css <link>, no apply-overrides.js fetch, no load-order
     dance. That single import is what the Kraken portal drops into its page. The
     button flips the SAME bundle between the two lanes:
       • view  → client lane: read-only (Kraken layers its W3C comment UI on top)
       • edit  → agency lane: full click-to-retype / swap / drag
     This mirrors the permission toggle Kraken passes per reviewer. -->
<style>
  html,body{margin:0;height:100%;background:#08090b;color:#e8eaed;font:14px system-ui;}
  #bar{position:fixed;z-index:10;top:0;left:0;right:0;height:42px;display:flex;align-items:center;
       gap:14px;padding:0 16px;background:#111316;border-bottom:1px solid #23262b;}
  #bar b{color:#fff;} #mode{padding:3px 10px;border-radius:99px;background:#1d2024;border:1px solid #2c3036;}
  #mode.edit{color:#7ee0a2;border-color:#2f5d44;} #mode.view{color:#9cc4ff;border-color:#2f4a6d;}
  button{cursor:pointer;background:#c4141d;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:600;}
  #host{position:fixed;inset:42px 0 0 0;}
</style>
</head>
<body>
<div id="bar">
  <b>CreativeEngine editor</b> — embeddable bundle
  <span>lane: <span id="mode" class="edit">edit</span></span>
  <button id="toggle">Toggle permission (view ⟷ edit)</button>
</div>
<div id="host"></div>

<script type="module">
  // THE ONLY IMPORT. One file = the whole editor (UI + CSS + apply-overrides + montage).
  import { mountEditor } from './creative-engine-editor.bundle.js';

  const params = new URLSearchParams(location.search);
  // default tagged design lives 3 levels up (dist/ → editor/ → creative-engine/ → repo).
  const htmlPath = params.get('html') || '../../../campaigns/westfield-100-off/index.tagged.html';
  const html = await (await fetch(htmlPath)).text();
  const baseHref = new URL(htmlPath, location.href).href.replace(/[^/]*$/, '');

  const mediaLibrary = [
    { src: '/campaigns/westfield-100-off/assets/vid/ad1.mp4', type: 'video', label: 'ad1 footage' },
    { src: '/campaigns/westfield-100-off/assets/vid/ad2.mp4', type: 'video', label: 'ad2 footage' },
    { src: '/campaigns/westfield-100-off/assets/vid/ad3.mp4', type: 'video', label: 'ad3 footage' },
  ];

  const host = document.getElementById('host');
  const modeEl = document.getElementById('mode');
  let permissions = params.get('view') ? 'view' : 'edit';
  let ed = null;

  function mount() {
    if (ed) { ed.destroy(); host.innerHTML = ''; }
    ed = mountEditor({
      container: host,
      html, baseHref, permissions,
      mediaProvider: { staticLibrary: mediaLibrary },
      onChange(ov) { window.__CE_OVERRIDES__ = ov; },
    });
    modeEl.textContent = permissions;
    modeEl.className = permissions;
    window.__CE_EDITOR__ = ed;
    window.__CE_PERMISSIONS__ = permissions;   // read by the evidence harness
  }

  document.getElementById('toggle').addEventListener('click', () => {
    permissions = permissions === 'edit' ? 'view' : 'edit';
    mount();
  });

  // let the harness flip the mode without a click, deterministically.
  window.__CE_SET_PERMISSIONS__ = (p) => { permissions = p; mount(); };

  mount();
</script>
</body>
</html>
