<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body style="padding:28px 32px">
    <p class="card-label">Form inputs · location finder + booking</p>
    <style>
      .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-3); font-weight:600; margin-bottom:6px; display:block }
      .ipt { width:100%; height:48px; padding:0 16px; border:1.5px solid var(--border-2); border-radius:4px; font-family:var(--font-body); font-size:15px; background:#fff; color:var(--fg-1); transition: border-color 120ms }
      .ipt:focus { outline:none; border-color:var(--aa-red-600) }
      .ipt-grp { display:flex; gap:0; align-items:stretch }
      .ipt-grp .ipt { border-top-right-radius:0; border-bottom-right-radius:0; border-right:0 }
      .ipt-grp button { padding:0 22px; background:var(--aa-red-600); color:#fff; border:0; font-family:var(--font-body); font-weight:500; font-size:14px; border-top-right-radius:4px; border-bottom-right-radius:4px; display:inline-flex; align-items:center; gap:6px; cursor:pointer }
    </style>
    <div style="display:flex; flex-direction:column; gap:14px; margin-top:14px">
      <div><label class="lbl">Athlete's name</label><input class="ipt" type="text" placeholder="First and last name"></div>
      <div><label class="lbl">Find your nearest facility</label>
        <div class="ipt-grp"><input class="ipt" type="text" placeholder="Enter ZIP code"><button>GO <span class="material-symbols-rounded" style="font-size:16px">arrow_forward</span></button></div>
      </div>
    </div>
  </body></html>
