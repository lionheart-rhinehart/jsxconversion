<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;background:var(--ink);color:#fff;padding:0;box-sizing:border-box;font-family:var(--font-body);position:relative;height:260px;overflow:hidden}
  .photo{position:absolute;inset:0;background:url(../assets/hero-original.webp) center/cover}
  .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,52,84,.88) 0%,rgba(28,28,29,.5) 55%,rgba(28,28,29,.05) 100%)}
  .content{position:relative;z-index:2;padding:34px 36px;max-width:62%}
  .eyebrow{font:var(--eyebrow);text-transform:uppercase;letter-spacing:.18em;color:var(--isp-blue-300);display:inline-flex;align-items:center;gap:.5em}
  .eyebrow::before{content:"";width:26px;height:2px;background:var(--isp-blue-300)}
  h2{font:var(--h1);text-transform:uppercase;letter-spacing:-.01em;font-size:40px;margin:10px 0 0;line-height:.95}
  .em{color:var(--isp-blue-300)}
  .note{position:absolute;right:14px;bottom:12px;z-index:2;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.55)}
</style></head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="content">
    <span class="eyebrow">Fort Worth, TX</span>
    <h2>Real reps.<br><span class="em">Real</span> results.</h2>
  </div>
  <span class="note">Imagery · in-gym training photography · warm diagonal scrim</span>
</body></html>
