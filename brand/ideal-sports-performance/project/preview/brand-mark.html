<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;background:var(--white);color:var(--ink);padding:28px 32px;box-sizing:border-box;font-family:var(--font-body);display:flex;gap:30px;align-items:center}
  .title{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:15px;color:var(--gray-600);margin:0 0 6px}
  .sub{font-size:12.5px;color:var(--fg-muted);line-height:1.5;margin:0}
  .badge-wrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}
  .badge{width:200px;padding:18px;border:1.5px dashed var(--border-strong);border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--gray-50)}
  .badge img{width:100%;display:block}
  .cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--gray-400);font-weight:600}
</style></head>
<body>
  <div>
    <p class="title">App / favicon mark</p>
    <p class="sub">When space is tight, the <b>IDEAL</b> blue badge stands alone as the icon — never stretch or recolor it. Keep clear space equal to the badge's corner radius on all sides. Pair the full lockup ("Sports Performance &amp; Fitness") wherever the layout allows.</p>
  </div>
  <div class="badge-wrap">
    <div class="badge"><img src="../assets/logo-badge.png" alt="ISP badge"></div>
    <span class="cap">Badge / standalone icon</span>
  </div>
</body></html>
