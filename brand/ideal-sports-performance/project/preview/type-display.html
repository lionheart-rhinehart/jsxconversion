<!-- @dsCard group="Type" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;background:var(--white);font-family:var(--font-body);color:var(--ink);padding:28px 32px;box-sizing:border-box}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding:10px 0}
  .row:last-child{border-bottom:0}
  .spec{font-family:var(--font-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);white-space:nowrap}
  .d1{font:var(--display-1);text-transform:uppercase;letter-spacing:-.015em;color:var(--ink);font-size:52px;line-height:.92}
  .hh1{font:var(--h1);text-transform:uppercase;letter-spacing:-.01em;font-size:40px}
  .hh2{font:var(--h2);text-transform:uppercase;font-size:30px;color:var(--isp-blue)}
  .hh3{font:var(--h3);text-transform:uppercase;font-size:22px}
</style></head>
<body>
  <div class="row"><span class="d1">Increase Velocity</span><span class="spec">Display · 800</span></div>
  <div class="row"><span class="hh1">Train Like A Pro</span><span class="spec">H1 · 700</span></div>
  <div class="row"><span class="hh2">Baseball Performance</span><span class="spec">H2 · 700 · blue</span></div>
  <div class="row"><span class="hh3">Speed &amp; Agility</span><span class="spec">H3 · 600</span></div>
</body></html>
