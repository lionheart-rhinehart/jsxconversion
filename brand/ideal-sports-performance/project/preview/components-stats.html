<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;background:var(--ink);color:#fff;padding:32px;box-sizing:border-box;font-family:var(--font-body);display:flex;gap:20px}
  .stat{flex:1;text-align:center}
  .num{font-family:var(--font-display);font-weight:800;font-size:58px;line-height:.85;color:#fff;font-variant-numeric:tabular-nums}
  .num .u{font-size:26px;color:var(--isp-blue-300)}
  .lbl{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--fg-on-dark-muted);margin-top:8px}
  .div{width:1px;background:rgba(255,255,255,.12)}
</style></head>
<body>
  <div class="stat"><div class="num">+6<span class="u">mph</span></div><div class="lbl">Avg velocity gain</div></div>
  <div class="div"></div>
  <div class="stat"><div class="num">12<span class="u">wk</span></div><div class="lbl">Program length</div></div>
  <div class="div"></div>
  <div class="stat"><div class="num">300<span class="u">+</span></div><div class="lbl">Athletes trained</div></div>
  <div class="div"></div>
  <div class="stat"><div class="num">1<span class="u">st</span></div><div class="lbl">Class free</div></div>
</body></html>
