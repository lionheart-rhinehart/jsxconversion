<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;background:var(--white);color:var(--ink);padding:28px 32px;box-sizing:border-box;font-family:var(--font-body)}
  .title{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:15px;color:var(--gray-600);margin:0 0 14px}
  .grid{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box}
  .sw .name{font-weight:600;font-size:12px}
  .sw .hex{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
</style></head>
<body>
  <p class="title">ISP Blue — the hero color</p>
  <div class="grid">
    <div class="sw" style="background:#0f3454;color:#fff"><span class="name">900</span><span class="hex">#0f3454</span></div>
    <div class="sw" style="background:#154873;color:#fff"><span class="name">800</span><span class="hex">#154873</span></div>
    <div class="sw" style="background:#1c5a91;color:#fff"><span class="name">700</span><span class="hex">#1c5a91</span></div>
    <div class="sw" style="background:#2573b7;color:#fff"><span class="name">Blue ·500</span><span class="hex">#2573b7</span></div>
    <div class="sw" style="background:#4a90d9;color:#fff"><span class="name">400</span><span class="hex">#4a90d9</span></div>
    <div class="sw" style="background:#7db0e3;color:#0f3454"><span class="name">300</span><span class="hex">#7db0e3</span></div>
    <div class="sw" style="background:#eaf2fb;color:#154873"><span class="name">tint</span><span class="hex">#eaf2fb</span></div>
  </div>
</body></html>
