<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;background:var(--white);color:var(--ink);padding:28px 32px;box-sizing:border-box;font-family:var(--font-body)}
  .title{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:15px;color:var(--gray-600);margin:0 0 14px}
  .grid{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box}
  .sw .name{font-weight:600;font-size:12px}
  .sw .hex{font-size:10.5px;opacity:.85;font-variant-numeric:tabular-nums}
</style></head>
<body>
  <p class="title">Ink &amp; warm-neutral ramp</p>
  <div class="grid">
    <div class="sw" style="background:#1c1c1d;color:#fff"><span class="name">Ink</span><span class="hex">#1c1c1d</span></div>
    <div class="sw" style="background:#3a3a3d;color:#fff"><span class="name">700</span><span class="hex">#3a3a3d</span></div>
    <div class="sw" style="background:#5c5c61;color:#fff"><span class="name">600</span><span class="hex">#5c5c61</span></div>
    <div class="sw" style="background:#7a7a80;color:#fff"><span class="name">500</span><span class="hex">#7a7a80</span></div>
    <div class="sw" style="background:#a6a6ac;color:#1c1c1d"><span class="name">400</span><span class="hex">#a6a6ac</span></div>
    <div class="sw" style="background:#d3d4d8;color:#1c1c1d"><span class="name">300</span><span class="hex">#d3d4d8</span></div>
    <div class="sw" style="background:#e6e7ea;color:#1c1c1d"><span class="name">200</span><span class="hex">#e6e7ea</span></div>
    <div class="sw" style="background:#f1f2f4;color:#1c1c1d"><span class="name">100</span><span class="hex">#f1f2f4</span></div>
    <div class="sw" style="background:#f7f8fa;color:#1c1c1d;border-right:1px solid var(--border)"><span class="name">50</span><span class="hex">#f7f8fa</span></div>
  </div>
</body></html>
