<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;background:var(--white);color:var(--ink);padding:30px 32px;box-sizing:border-box;font-family:var(--font-body)}
  .grid{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .btn{font:var(--button);border-radius:var(--radius-pill);border:0;cursor:pointer;padding:14px 28px;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px}
  .primary{background:var(--isp-blue);color:#fff;box-shadow:var(--shadow-blue)}
  .primary.hover{background:var(--isp-blue-700)}
  .secondary{background:var(--ink);color:#fff}
  .ghost{background:transparent;color:var(--isp-blue);border:2px solid var(--isp-blue);padding:12px 26px}
  .light{background:var(--isp-blue-tint);color:var(--isp-blue-800)}
  .disabled{background:var(--gray-200);color:var(--gray-400);box-shadow:none;cursor:not-allowed}
  .sm{padding:9px 18px;font-size:13px}
  .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-400);margin:0 0 14px}
</style></head>
<body>
  <p class="tag">Buttons</p>
  <div class="grid">
    <button class="btn primary">Try ISP Free</button>
    <button class="btn primary hover">Hover</button>
    <button class="btn secondary">Learn More</button>
    <button class="btn ghost">View Programs</button>
    <button class="btn light">Sign Up</button>
    <button class="btn primary sm">Small CTA</button>
    <button class="btn disabled">Disabled</button>
  </div>
</body></html>
