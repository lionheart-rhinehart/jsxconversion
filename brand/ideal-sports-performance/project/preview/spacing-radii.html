<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;background:var(--white);color:var(--ink);padding:28px 32px;box-sizing:border-box;font-family:var(--font-body)}
  .title{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:15px;color:var(--gray-600);margin:0 0 16px}
  .row{display:flex;gap:18px;align-items:flex-end}
  .item{text-align:center}
  .box{width:96px;height:64px;background:var(--isp-blue-tint);border:1.5px solid var(--isp-blue);}
  .lbl{font-size:11px;margin-top:8px;color:var(--gray-600);font-weight:600}
  .px{font-size:10px;color:var(--gray-400)}
</style></head>
<body>
  <p class="title">Corner radii</p>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="lbl">sm</div><div class="px">6px</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="lbl">default</div><div class="px">10px</div></div>
    <div class="item"><div class="box" style="border-radius:18px"></div><div class="lbl">lg</div><div class="px">18px</div></div>
    <div class="item"><div class="box" style="border-radius:28px"></div><div class="lbl">xl</div><div class="px">28px</div></div>
    <div class="item"><div class="box" style="border-radius:999px;width:64px"></div><div class="lbl">pill</div><div class="px">999px</div></div>
  </div>
</body></html>
