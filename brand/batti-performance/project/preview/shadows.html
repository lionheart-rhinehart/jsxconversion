<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:34px 32px;background:var(--bg);display:flex;gap:34px;align-items:center;flex-wrap:wrap;}
  .b{display:flex;flex-direction:column;gap:14px;align-items:center;}
  .box{width:120px;height:64px;background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);}
</style></head>
<body>
  <div class="b"><div class="box" style="box-shadow:var(--shadow-1)"></div><div class="tag">--shadow-1</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--shadow-2)"></div><div class="tag">--shadow-2</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--shadow-3)"></div><div class="tag">--shadow-3</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--shadow-red);border-color:var(--bp-red)"></div><div class="tag">--shadow-red</div></div>
</body></html>
