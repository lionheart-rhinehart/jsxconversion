<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:0;background:var(--bg-dark);display:flex;align-items:center;gap:40px;padding:28px 38px;}
  .badges{display:flex;gap:22px;align-items:center;flex:none;}
  .badges img{height:104px;width:104px;display:block;}
  .lock{display:flex;align-items:center;gap:14px;}
  .lock img{height:52px;width:auto;display:block;}
  .word{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:22px;color:#fff;letter-spacing:.01em;line-height:1;white-space:nowrap;}
  .word .r{color:var(--bp-red);}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted-dark);margin-top:14px;}
</style></head>
<body>
  <div class="badges">
    <img src="../assets/logo-badge.png" alt="Batti-Performance badge (chrome)">
    <img src="../assets/logo-badge-white.png" alt="Batti-Performance badge (white)">
  </div>
  <div>
    <div class="lock">
      <img src="../assets/logo-monogram.png" alt="BP monogram">
      <span class="word"><span class="r">BATTI</span>&#8211;PERFORMANCE</span>
    </div>
    <div class="cap">Circular badge (chrome / white) &middot; monogram + horizontal lockup</div>
  </div>
</body></html>
