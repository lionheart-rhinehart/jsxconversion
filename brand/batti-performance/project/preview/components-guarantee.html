<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:26px 30px;background:var(--bg-dark);}
  .g{border:1px solid var(--border-dark);border-left:4px solid var(--bp-red);border-radius:var(--r-md);padding:22px 26px;display:flex;align-items:center;gap:22px;background:var(--surface-dark);}
  .ico{color:var(--bp-red);font-size:38px;flex:none;}
  .copy{color:#fff;}
  .nums{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:23px;line-height:1.22;letter-spacing:-.01em;margin-bottom:10px;}
  .nums b{color:var(--bp-red);}
  .fine{font-family:var(--font-body);font-size:14px;color:var(--fg-muted-dark);margin:0;}
</style></head>
<body>
  <div class="g">
    <svg class="material-symbols-rounded ico" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;flex:none"><path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
    <div class="copy">
      <div class="nums"><b>+3″</b> vertical · <b>+1mph</b> speed · <b>30</b> sessions</div>
      <p class="fine">…or we train them FREE until they hit the numbers. The guarantee — set verbatim, never paraphrased.</p>
    </div>
  </div>
</body></html>
