<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 32px;background:var(--bg);display:flex;gap:26px;align-items:flex-end;}
  .b{display:flex;flex-direction:column;gap:10px;align-items:center;}
  .box{width:88px;height:74px;background:var(--bp-black);}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);}
</style></head>
<body>
  <div class="b"><div class="box" style="border-radius:2px"></div><div class="tag">--r-xs · 2</div></div>
  <div class="b"><div class="box" style="border-radius:4px"></div><div class="tag">--r-sm · 4</div></div>
  <div class="b"><div class="box" style="border-radius:6px"></div><div class="tag">--r-md · 6</div></div>
  <div class="b"><div class="box" style="border-radius:10px"></div><div class="tag">--r-lg · 10</div></div>
  <div class="b"><div class="box" style="border-radius:999px;width:74px;background:var(--bp-red)"></div><div class="tag">--r-pill</div></div>
</body></html>
