<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:26px 30px;background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .step{border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;background:#fff;box-shadow:var(--shadow-2);position:relative;overflow:hidden;}
  .num{font-family:var(--font-display);font-weight:900;font-size:64px;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--bp-red);margin-bottom:10px;}
  .ttl{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:17px;line-height:1.05;color:var(--fg);margin-bottom:8px;}
  .txt{font-family:var(--font-body);font-size:13px;line-height:1.5;color:var(--fg-muted);margin:0;}
</style></head>
<body>
  <div class="step"><div class="num">01</div><div class="ttl">Precision Assessment</div><p class="txt">We measure exactly where your child's explosive potential is locked.</p></div>
  <div class="step"><div class="num">02</div><div class="ttl">Explosive Development</div><p class="txt">A custom-engineered protocol for vertical, acceleration, and agility.</p></div>
  <div class="step"><div class="num">03</div><div class="ttl">Total Transformation</div><p class="txt">Physical capability and the character to use it when it matters.</p></div>
</body></html>
