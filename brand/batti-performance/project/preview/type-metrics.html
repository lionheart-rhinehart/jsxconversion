<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 32px;background:var(--bg);display:flex;gap:40px;align-items:center;flex-wrap:wrap;}
  .metric{display:flex;flex-direction:column;}
  .val{font-family:var(--font-display);font-weight:800;font-size:62px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:-.01em;}
  .val .u{color:var(--bp-red);}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted);margin-top:8px;}
  .eyebrow-demo{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bp-red);}
</style></head>
<body>
  <div class="metric"><div class="val">+3<span class="u">″</span></div><div class="cap">Vertical</div></div>
  <div class="metric"><div class="val">+1<span class="u">mph</span></div><div class="cap">Speed</div></div>
  <div class="metric"><div class="val">30</div><div class="cap">Sessions</div></div>
  <div class="metric"><div class="val">2,257<span class="u">+</span></div><div class="cap">Athletes · tabular mono</div></div>
</body></html>
