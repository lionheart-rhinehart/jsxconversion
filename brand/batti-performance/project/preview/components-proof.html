<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>

  .proof b{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;font-size:24px;color:var(--fg);margin-right:4px;}
  .proof span{font-family:var(--font-body);font-size:16px;color:var(--fg);}

  <div class="proof"><svg class="material-symbols-rounded ck" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;flex:none"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.4 2.4 4.6-4.8"/></svg><span><b>100%</b> guaranteed results — <em>+3″ vertical & +1mph speed</em></span></div>
  <div class="proof"><svg class="material-symbols-rounded ck" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;flex:none"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.4 2.4 4.6-4.8"/></svg><span><b>92%</b> of parents report increased confidence beyond sport</span></div>
