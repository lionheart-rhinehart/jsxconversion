<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:30px 34px;background:var(--bg);}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--bp-red);margin-bottom:14px;}
  .head{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:46px;line-height:.9;letter-spacing:-.01em;color:var(--fg);margin:0 0 14px;max-width:620px;}
  .head .accent{color:var(--bp-red);}
  .sub{font-family:var(--font-body);font-size:16px;color:var(--fg-muted);max-width:560px;margin:0;}
</style></head>
<body>
  <div class="eyebrow">The difference is in our approach</div>
  <h2 class="head">We build athletes from the <span class="accent">inside out</span></h2>
  <p class="sub">Eyebrow (mono, letterspaced, red) → display headline with a single accent word → muted support line. The brand's core text block.</p>
</body></html>
