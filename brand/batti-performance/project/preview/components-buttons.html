<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 32px;background:var(--bg);display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .btn{font-family:var(--font-body);font-weight:700;font-size:15px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:var(--r-sm);transition:all var(--dur-mid) var(--ease-out);white-space:nowrap;}
  .material-symbols-rounded{font-size:19px;}
  .primary{background:var(--bp-red);color:#fff;}
  .primary:hover{background:var(--bp-red-hover);box-shadow:var(--shadow-red);transform:translateY(-1px);}
  .secondary{background:var(--bp-black);color:#fff;}
  .secondary:hover{transform:translateY(-1px);box-shadow:var(--shadow-2);}
  .outline{background:transparent;color:var(--fg);border:1.5px solid var(--border-strong);}
  .outline:hover{border-color:var(--bp-black);}
  .ghost{background:transparent;color:var(--bp-red);padding:13px 8px;}
  .ghost:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.1em;}
</style></head>
<body>
  <div class="row">
    <button class="btn primary">Claim your athlete analysis <svg class="material-symbols-rounded" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;flex:none"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    <button class="btn secondary">Apply Now</button>
    <button class="btn outline">View Programs</button>
    <button class="btn ghost">Learn more</button>
  </div>
  <div class="row">
    <span class="tag">Primary · red CTA</span>
    <span class="tag">Secondary · black</span>
    <span class="tag">Outline</span>
    <span class="tag">Ghost / link</span>
  </div>
</body></html>
