<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:26px 32px;background:var(--bg);}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:9px;}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);width:96px;flex:none;}
  .bar{height:16px;background:var(--bp-red);border-radius:2px;}
</style></head>
<body>
  <div class="row"><span class="tag">--s-1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="tag">--s-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tag">--s-3 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="tag">--s-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tag">--s-5 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tag">--s-6 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tag">--s-7 · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tag">--s-8 · 64</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="tag">--s-9 · 96</span><div class="bar" style="width:96px"></div></div>
  <div class="row"><span class="tag">--s-10 · 128</span><div class="bar" style="width:128px"></div></div>
</body></html>
