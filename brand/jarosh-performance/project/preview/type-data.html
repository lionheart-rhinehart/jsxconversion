<!-- @dsCard group="Type" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"></head>
<body>
  <div class="col" style="gap:14px">
    <p class="card-label">Data · JetBrains Mono · tabular-nums · units muted</p>
    <div class="row" style="gap:34px;align-items:flex-end">
      <div class="jp-data" style="font-size:60px;line-height:0.9">&minus;0.18<span style="font-size:22px;color:var(--fg-3);font-weight:600">s</span></div>
      <div class="jp-data" style="font-size:60px;line-height:0.9;color:var(--jp-gain)">+3.5<span style="font-size:22px;color:var(--fg-3);font-weight:600">″</span></div>
      <div class="jp-data" style="font-size:60px;line-height:0.9">1.42<span style="font-size:22px;color:var(--fg-3);font-weight:600">s</span></div>
    </div>
    <div class="row" style="gap:10px;font-family:var(--font-mono);font-size:13px;color:var(--fg-3);font-weight:600;letter-spacing:0.04em">
      <span style="padding:4px 8px;border:1px solid var(--border-1);border-radius:3px">10/20/40</span>
      <span style="padding:4px 8px;border:1px solid var(--border-1);border-radius:3px">VERT 36.5</span>
      <span style="padding:4px 8px;border:1px solid var(--border-1);border-radius:3px">RFD +22%</span>
      <span style="padding:4px 8px;border:1px solid var(--border-1);border-radius:3px">90 DAYS</span>
    </div>
  </div>
</body></html>
