<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-body);font-weight:500;font-size:15px;padding:13px 20px;border-radius:var(--r-md);border:0;cursor:pointer;transition:all var(--dur-base) var(--ease-out)}
  .btn .material-symbols-rounded{font-size:18px}
  .primary{background:var(--jp-red-500);color:#fff}
  .primary:hover{background:var(--jp-red-600);transform:translateY(-1px);box-shadow:var(--shadow-red)}
  .dark{background:var(--jp-ink-950);color:#fff}
  .dark:hover{background:var(--jp-ink-800);transform:translateY(-1px)}
  .outline{background:transparent;color:var(--fg-1);border:1.5px solid var(--border-strong)}
  .outline:hover{background:var(--jp-ink-950);color:#fff}
  .ghost{background:transparent;color:var(--jp-red-700);padding-left:2px;padding-right:2px}
  .sm{padding:9px 14px;font-size:13px}
  .pressed{background:var(--jp-red-700);transform:scale(0.99)}
  .darkrow{background:var(--jp-ink-950);padding:14px 16px;border-radius:var(--r-lg);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .outline-light{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.28)}
</style></head>
<body>
  <div class="col" style="gap:14px">
    <p class="card-label">Buttons · 4px radius · lift + glow on primary hover</p>
    <div class="row" style="gap:12px;flex-wrap:wrap">
      <button class="btn primary">Book An Assessment <span class="material-symbols-rounded">arrow_forward</span></button>
      <button class="btn dark">See The Data</button>
      <button class="btn outline">View Schedules</button>
      <button class="btn ghost">Learn more <span class="material-symbols-rounded">chevron_right</span></button>
    </div>
    <div class="row" style="gap:12px;flex-wrap:wrap;align-items:center">
      <button class="btn primary sm">Start Baseline</button>
      <button class="btn primary pressed">Pressed</button>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">↑ active state</span>
    </div>
    <div class="darkrow">
      <button class="btn primary">Book Assessment <span class="material-symbols-rounded">arrow_forward</span></button>
      <button class="btn outline-light">View Schedules</button>
    </div>
  </div>
</body></html>
