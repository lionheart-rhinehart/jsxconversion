<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border-1)}
  .sw{height:72px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9.5px;font-weight:600}
  .big{display:flex;gap:12px;align-items:center;margin-top:4px}
  .chip{width:64px;height:64px;border-radius:var(--r-md);box-shadow:var(--shadow-2)}
</style></head>
<body>
  <div class="col" style="gap:12px">
    <p class="card-label">Signal Red · <span style="color:var(--jp-red-700)">--jp-red-500 · #FA3F36</span></p>
    <div class="scale">
      <div class="sw" style="background:var(--jp-red-50);color:#7a1410">50</div>
      <div class="sw" style="background:var(--jp-red-100);color:#7a1410">100</div>
      <div class="sw" style="background:var(--jp-red-200);color:#7a1410">200</div>
      <div class="sw" style="background:var(--jp-red-300);color:#5a1310">300</div>
      <div class="sw" style="background:var(--jp-red-400);color:#fff">400</div>
      <div class="sw" style="background:var(--jp-red-500);color:#fff">500</div>
      <div class="sw" style="background:var(--jp-red-600);color:#fff">600</div>
      <div class="sw" style="background:var(--jp-red-700);color:#fff">700</div>
      <div class="sw" style="background:var(--jp-red-800);color:#fff">800</div>
      <div class="sw" style="background:var(--jp-red-900);color:#fff">900</div>
    </div>
    <p style="font-size:13px;color:var(--fg-3);margin:4px 0 0;max-width:64ch">Used surgically — CTAs, the active data point, the accent word, the leading edge of a chart. Never on body copy, never a full-bleed wash.</p>
  </div>
</body></html>
