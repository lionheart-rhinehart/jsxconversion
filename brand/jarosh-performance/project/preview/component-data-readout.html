<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .strip{background:var(--jp-ink-950);border-radius:var(--r-lg);padding:16px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .live{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--jp-red-bright)}
  .live .pulse{width:8px;height:8px;border-radius:50%;background:var(--jp-red-500);animation:p 2.4s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.7)}}
  .read{display:flex;flex-direction:column;gap:2px}
  .rk{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--jp-steel)}
  .rv{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:21px;color:#fff;letter-spacing:-0.01em}
  .rv .material-symbols-rounded{font-size:15px;color:var(--jp-gain)}
  .sep{width:1px;height:34px;background:var(--jp-ink-700)}
  .axis{flex:1;min-width:120px;height:40px;position:relative}
</style></head>
<body>
  <div class="col" style="gap:12px">
    <p class="card-label">Telemetry readout · live session strip</p>
    <div class="strip calib-grid">
      <span class="live"><span class="pulse"></span>Now Measuring</span>
      <div class="sep"></div>
      <div class="read"><span class="rk">Top speed</span><span class="rv">18.4<span style="font-size:12px;color:var(--jp-steel)"> mph</span></span></div>
      <div class="read"><span class="rk">Best 10-yd</span><span class="rv">1.58<span style="font-size:12px;color:var(--jp-steel)"> s</span></span></div>
      <div class="read"><span class="rk">Reps</span><span class="rv">12</span></div>
      <div class="read"><span class="rk">vs last</span><span class="rv" style="color:var(--jp-gain)"><span class="material-symbols-rounded mat-fill">trending_up</span>+6%</span></div>
      <div class="axis"><svg width="100%" height="40" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline points="0,34 28,30 56,31 84,22 112,24 140,14 168,12 200,5" fill="none" stroke="#fb5f55" stroke-width="2"/></svg></div>
    </div>
  </div>
</body></html>
