<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .nav{display:flex;align-items:center;gap:14px;padding:12px 18px;border:1px solid var(--border-1);border-radius:var(--r-lg);background:rgba(255,255,255,0.9)}
  .lock{display:flex;align-items:center;gap:11px}
  .lock img{height:34px}
  .wm{font-family:var(--font-display);text-transform:uppercase;line-height:0.82;letter-spacing:0.01em}
  .wm .n1{font-size:19px;display:block}
  .wm .n2{font-size:9.5px;letter-spacing:0.42em;color:var(--fg-3)}
  .sp{flex:1}
  .lk{padding:7px 11px;font-size:14px;font-weight:500;color:var(--fg-1);display:inline-flex;align-items:center;gap:3px;border-radius:var(--r-md)}
  .lk .material-symbols-rounded{font-size:18px;color:var(--fg-3)}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--jp-red-500);color:#fff;font-weight:600;font-size:13px;padding:9px 15px;border-radius:var(--r-md);border:0}
  .btn .material-symbols-rounded{font-size:16px}
  .darkwrap{background:var(--jp-ink-950);padding:14px;border-radius:var(--r-lg);margin-top:12px}
  .darkwrap .nav{background:transparent;border-color:var(--jp-ink-700)}
  .darkwrap .wm .n1{color:#fff}.darkwrap .lk{color:rgba(255,255,255,0.85)}
</style></head>
<body>
  <div class="col" style="gap:8px">
    <p class="card-label">Nav lockup · mark + Anton wordmark · on light &amp; dark</p>
    <div class="nav">
      <div class="lock"><img src="../assets/logo-mark.svg"><span class="wm"><span class="n1">Jarosh</span><span class="n2">Performance</span></span></div>
      <div class="sp"></div>
      <span class="lk">Programs <span class="material-symbols-rounded">expand_more</span></span>
      <span class="lk">Results</span>
      <span class="lk"><span class="material-symbols-rounded">location_on</span></span>
      <button class="btn">Book Assessment <span class="material-symbols-rounded">arrow_forward</span></button>
    </div>
    <div class="darkwrap">
      <div class="nav">
        <div class="lock"><img src="../assets/logo-mark.svg"><span class="wm"><span class="n1">Jarosh</span><span class="n2">Performance</span></span></div>
        <div class="sp"></div>
        <span class="lk">Programs</span><span class="lk">Results</span>
        <button class="btn">Book Assessment</button>
      </div>
    </div>
  </div>
</body></html>
