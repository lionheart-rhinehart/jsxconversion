<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border-1)}
  .sw{height:72px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9.5px;font-weight:600}
</style></head>
<body>
  <div class="col" style="gap:12px">
    <p class="card-label">Carbon Neutrals · cool, instrument-grade grayscale</p>
    <div class="scale">
      <div class="sw" style="background:var(--jp-ink-950);color:#fff">950</div>
      <div class="sw" style="background:var(--jp-ink-900);color:#fff">900</div>
      <div class="sw" style="background:var(--jp-ink-800);color:#fff">800</div>
      <div class="sw" style="background:var(--jp-ink-700);color:#fff">700</div>
      <div class="sw" style="background:var(--jp-ink-600);color:#fff">600</div>
      <div class="sw" style="background:var(--jp-ink-500);color:#fff">500</div>
      <div class="sw" style="background:var(--jp-ink-400);color:#fff">400</div>
      <div class="sw" style="background:var(--jp-ink-300);color:#0a0c0f">300</div>
      <div class="sw" style="background:var(--jp-ink-200);color:#0a0c0f">200</div>
      <div class="sw" style="background:var(--jp-ink-100);color:#0a0c0f">100</div>
      <div class="sw" style="background:var(--jp-ink-50);color:#0a0c0f">50</div>
    </div>
    <p style="font-size:13px;color:var(--fg-3);margin:4px 0 0;max-width:64ch">Cool/blue-leaning blacks — the lab, not the locker room. 950 grounds hero &amp; data panels; 50 is the page canvas.</p>
  </div>
</body></html>
