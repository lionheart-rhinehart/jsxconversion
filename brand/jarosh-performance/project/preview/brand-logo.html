<!-- @dsCard group="Brand" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .box{border-radius:var(--r-lg);padding:20px;display:flex;align-items:center;gap:16px;border:1px solid var(--border-1)}
  .dark{background:var(--jp-ink-950);border-color:var(--jp-ink-700)}
  .light{background:var(--bg-2)}
  .box img{height:58px}
  .wm{font-family:var(--font-display);text-transform:uppercase;line-height:0.8;letter-spacing:0.01em}
  .wm .n1{font-size:30px;display:block}
  .wm .n2{font-size:13px;letter-spacing:0.34em;color:var(--jp-red-600)}
  .dark .wm .n1{color:#fff}
  .flag{font-family:var(--font-mono);font-size:11px;color:var(--jp-warning);font-weight:600;display:flex;align-items:center;gap:6px}
  .flag .material-symbols-rounded{font-size:15px}
</style></head>
<body>
  <div class="col" style="gap:12px">
    <p class="card-label">Logo · placeholder mark + Anton lockup</p>
    <div class="grid">
      <div class="box light"><img src="../assets/logo-mark.svg"><span class="wm"><span class="n1">Jarosh</span><span class="n2">Performance</span></span></div>
      <div class="box dark"><img src="../assets/logo-mark.svg"><span class="wm"><span class="n1">Jarosh</span><span class="n2">Performance</span></span></div>
    </div>
    <div class="flag"><span class="material-symbols-rounded">flag</span>PLACEHOLDER — replace with the official Jarosh Performance logo (SVG)</div>
  </div>
</body></html>
