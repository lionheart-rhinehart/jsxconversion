<!-- @dsCard group="Type" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"></head>
<body>
  <div class="col" style="gap:16px">
    <p class="card-label">Eyebrows &amp; tags · mono · uppercase · tracked</p>
    <div class="row" style="gap:24px;flex-wrap:wrap">
      <span class="jp-tag" style="font-size:13px">Speed.Lab</span>
      <span class="jp-tag" style="font-size:13px">The Baseline</span>
      <span class="jp-tag" style="font-size:13px">Supercharged</span>
    </div>
    <div class="row" style="gap:24px;flex-wrap:wrap">
      <span class="jp-eyebrow" style="font-size:13px">Measured Progress</span>
      <span class="jp-eyebrow jp-eyebrow--muted" style="font-size:13px">// Results</span>
    </div>
    <div class="row" style="gap:12px">
      <span style="display:inline-flex;align-items:center;gap:9px;padding:7px 13px 7px 11px;background:var(--jp-red-500);color:var(--fg-on-red);font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;border-radius:2px">
        <span style="width:6px;height:6px;background:var(--fg-on-red);border-radius:50%"></span>Now Measuring</span>
      <span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(25,195,125,0.12);border:1px solid rgba(25,195,125,0.4);color:var(--jp-gain-dim);font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;border-radius:999px">New PR</span>
    </div>
  </div>
</body></html>
