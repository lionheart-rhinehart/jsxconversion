<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .tile{background:#fff;border:1px solid var(--border-1);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-1);position:relative}
  .tile.dark{background:var(--jp-ink-900);border-color:var(--jp-ink-700)}
  .top{border-top:2px solid var(--jp-red-500);position:absolute;top:0;left:0;width:38px;border-radius:8px 0 0 0}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
  .dark .lbl{color:var(--jp-ink-400)}
  .val{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;font-size:38px;line-height:1;margin:8px 0 2px}
  .dark .val{color:#fff}
  .u{font-size:15px;color:var(--fg-3);font-weight:600;margin-left:3px}
  .delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--jp-gain-dim)}
  .delta .material-symbols-rounded{font-size:15px}
  .dark .delta{color:var(--jp-gain)}
</style></head>
<body>
  <div class="col" style="gap:12px">
    <p class="card-label">Metric tile · mono value · gain delta · sparkline</p>
    <div class="tiles">
      <div class="tile"><span class="top"></span>
        <span class="lbl">10-yd split</span>
        <div class="val">1.62<span class="u">s</span></div>
        <span class="delta"><span class="material-symbols-rounded mat-fill">trending_up</span>&minus;0.18s</span>
        <svg width="100%" height="26" viewBox="0 0 120 26" preserveAspectRatio="none" style="margin-top:8px"><polyline points="0,20 24,18 48,19 72,12 96,9 120,4" fill="none" stroke="#19c37d" stroke-width="2"/></svg>
      </div>
      <div class="tile"><span class="top"></span>
        <span class="lbl">Vertical</span>
        <div class="val">36.5<span class="u">″</span></div>
        <span class="delta"><span class="material-symbols-rounded mat-fill">trending_up</span>+3.5″</span>
        <svg width="100%" height="26" viewBox="0 0 120 26" preserveAspectRatio="none" style="margin-top:8px"><polyline points="0,22 24,20 48,15 72,14 96,8 120,5" fill="none" stroke="#19c37d" stroke-width="2"/></svg>
      </div>
      <div class="tile dark calib-grid"><span class="top"></span>
        <span class="lbl">Force output</span>
        <div class="val">+22<span class="u">%</span></div>
        <span class="delta"><span class="material-symbols-rounded mat-fill">trending_up</span>vs baseline</span>
        <svg width="100%" height="26" viewBox="0 0 120 26" preserveAspectRatio="none" style="margin-top:8px"><polyline points="0,21 24,19 48,16 72,11 96,9 120,3" fill="none" stroke="#fb5f55" stroke-width="2"/></svg>
      </div>
    </div>
  </div>
</body></html>
