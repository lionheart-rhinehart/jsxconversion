<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .grid{display:flex;gap:26px;flex-wrap:wrap;padding:10px 4px 18px}
  .u{display:flex;flex-direction:column;align-items:center;gap:12px}
  .box{width:96px;height:64px;background:#fff;border-radius:var(--r-lg)}
  .cap{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);font-weight:600;text-align:center}
</style></head>
<body>
  <div class="col" style="gap:8px">
    <p class="card-label">Elevation · restrained · red glow only on CTA hover</p>
    <div class="grid">
      <div class="u"><div class="box" style="box-shadow:var(--shadow-1)"></div><span class="cap">shadow-1</span></div>
      <div class="u"><div class="box" style="box-shadow:var(--shadow-2)"></div><span class="cap">shadow-2 · card</span></div>
      <div class="u"><div class="box" style="box-shadow:var(--shadow-3)"></div><span class="cap">shadow-3 · hover</span></div>
      <div class="u"><div class="box" style="box-shadow:var(--shadow-4)"></div><span class="cap">shadow-4 · modal</span></div>
      <div class="u"><div class="box" style="box-shadow:var(--shadow-red);background:var(--jp-red-500)"></div><span class="cap">red · CTA</span></div>
    </div>
  </div>
</body></html>
