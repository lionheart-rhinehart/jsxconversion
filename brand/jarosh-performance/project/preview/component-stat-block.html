<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .block{background:var(--jp-ink-950);border-radius:var(--r-lg);padding:24px 26px;position:relative;overflow:hidden}
  .block::before{content:"";position:absolute;right:-80px;top:-60px;width:280px;height:280px;background:radial-gradient(closest-side,rgba(250,63,54,0.22),transparent)}
  .verified{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;background:rgba(250,63,54,0.14);border:1px solid rgba(250,63,54,0.4);border-radius:999px;color:var(--jp-red-bright);font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
  .verified .material-symbols-rounded{font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:20px;position:relative}
  .stat{border-top:2px solid var(--jp-red-500);padding-top:12px}
  .sv{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;font-size:46px;line-height:0.9;color:#fff}
  .su{font-size:17px;color:rgba(255,255,255,0.55);margin-left:3px}
  .sl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-top:7px}
</style></head>
<body>
  <div class="col" style="gap:12px">
    <p class="card-label">Stat block · the guarantee · measured outcomes</p>
    <div class="block calib-grid">
      <span class="verified"><span class="material-symbols-rounded mat-fill">verified</span>The Guarantee</span>
      <div class="stats">
        <div class="stat"><div class="sv">&minus;0.18<span class="su">s</span></div><div class="sl">10-yd split</div></div>
        <div class="stat"><div class="sv">+3.5<span class="su">″</span></div><div class="sl">vertical</div></div>
        <div class="stat"><div class="sv">90<span class="su">days</span></div><div class="sl">or you don't pay</div></div>
      </div>
    </div>
  </div>
</body></html>
