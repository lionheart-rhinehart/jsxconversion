<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .track{position:relative;height:46px;background:var(--jp-ink-100);border-radius:var(--r-md);overflow:hidden}
  .dot{position:absolute;top:9px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--jp-red-500)}
  .r1 .dot{animation:run 2.6s var(--ease-out) infinite}
  .r2 .dot{animation:run 2.6s var(--ease-snap) infinite}
  @keyframes run{0%,12%{left:6px}50%,62%{left:calc(100% - 34px)}100%{left:6px}}
  .lab{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);font-weight:600}
</style></head>
<body>
  <div class="col" style="gap:12px">
    <p class="card-label">Motion · quick &amp; calibrated · no bounce</p>
    <div class="col" style="gap:6px"><span class="lab">--ease-out · entrances</span><div class="track r1"><div class="dot"></div></div></div>
    <div class="col" style="gap:6px"><span class="lab">--ease-snap · state change</span><div class="track r2"><div class="dot"></div></div></div>
    <div class="row" style="gap:16px;margin-top:2px">
      <span class="lab" style="color:var(--fg-1)">120ms fast</span>
      <span class="lab" style="color:var(--fg-1)">200ms base</span>
      <span class="lab" style="color:var(--fg-1)">360ms slow</span>
    </div>
  </div>
</body></html>
