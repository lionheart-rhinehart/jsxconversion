<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"><style>
  .grid{display:flex;gap:18px;align-items:flex-end}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:76px;height:60px;background:var(--jp-ink-100);border:1.5px solid var(--jp-ink-300)}
  .cap{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);font-weight:600}
</style></head>
<body>
  <div class="col" style="gap:12px">
    <p class="card-label">Radii · squared &amp; precise · never &gt;12px</p>
    <div class="grid">
      <div class="u"><div class="box" style="border-radius:0"></div><span class="cap">none · 0</span></div>
      <div class="u"><div class="box" style="border-radius:2px"></div><span class="cap">sm · 2</span></div>
      <div class="u"><div class="box" style="border-radius:4px"></div><span class="cap">md · 4 · btn</span></div>
      <div class="u"><div class="box" style="border-radius:8px"></div><span class="cap">lg · 8 · card</span></div>
      <div class="u"><div class="box" style="border-radius:12px"></div><span class="cap">xl · 12</span></div>
      <div class="u"><div class="box" style="border-radius:999px;width:60px"></div><span class="cap">pill · chip</span></div>
    </div>
  </div>
</body></html>
