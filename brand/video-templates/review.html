<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AA · Creative Review</title>
<link rel="stylesheet" href="assets/aa-tokens.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #0a0b0d; color: #f6f7f9; font-family: var(--font-body, system-ui); }
  * { box-sizing: border-box; }
  a { color: inherit; }

  .page { max-width: 1320px; margin: 0 auto; padding: 36px 28px 96px; }

  /* Header + dashboard */
  .top { display: flex; align-items: flex-end; gap: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; }
  .top .eyebrow { font-family: var(--font-mono, monospace); font-size: 12px; letter-spacing: 0.18em; color: var(--aa-red-600, #c4141d); text-transform: uppercase; }
  .top h1 { font-family: var(--font-display, sans-serif); font-size: 52px; line-height: 0.9; margin: 8px 0 0; text-transform: uppercase; }
  .top h1 .accent { color: var(--aa-red-600, #c4141d); }
  .dash { margin-left: auto; display: flex; gap: 22px; font-family: var(--font-mono, monospace); }
  .dash .stat { text-align: right; }
  .dash .num { font-size: 22px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .dash .num.warn { color: #f59e0b; }
  .dash .num.ok { color: #4ade80; }
  .dash .lbl { font-size: 10px; letter-spacing: 0.12em; color: var(--aa-ink-400, #969ca7); text-transform: uppercase; margin-top: 2px; }

  .controls { display: flex; gap: 8px; margin: 22px 0 8px; flex-wrap: wrap; align-items: center; }
  .controls .filt { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.14); color: var(--aa-ink-300, #b8bdc6); font-family: var(--font-mono, monospace); font-size: 11px; letter-spacing: 0.1em; padding: 6px 12px; cursor: pointer; text-transform: uppercase; }
  .controls .filt.on { background: var(--aa-red-600, #c4141d); border-color: var(--aa-red-600, #c4141d); color: #fff; }
  .controls .sp { flex: 1; }
  .controls .meta { font-family: var(--font-mono, monospace); font-size: 11px; color: var(--aa-ink-400, #969ca7); letter-spacing: 0.1em; }

  /* Beat section */
  .beat { padding-top: 36px; }
  .beat h2 { font-family: var(--font-display, sans-serif); font-size: 26px; text-transform: uppercase; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); color: #fff; }
  .beat h2 .ct { font-family: var(--font-mono, monospace); font-size: 12px; color: var(--aa-ink-400, #969ca7); margin-left: 12px; letter-spacing: 0.12em; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

  .card { position: relative; background: #15171a; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; }
  .card.s-approved { border-color: rgba(74,222,128,0.5); }
  .card.s-changes { border-color: rgba(245,158,11,0.55); }
  .card.s-rendered { border-color: rgba(196,20,29,0.5); }

  .prev { position: relative; width: 100%; aspect-ratio: 9/16; background: #0a0b0d; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .prev img, .prev video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prev .ph { text-align: center; padding: 16px; }
  .prev .ph .fmt { font-family: var(--font-display, sans-serif); font-size: 30px; color: rgba(255,255,255,0.22); letter-spacing: 0.04em; }
  .prev .ph .sub { font-family: var(--font-mono, monospace); font-size: 10px; color: var(--aa-ink-500, #6b7280); letter-spacing: 0.14em; margin-top: 6px; text-transform: uppercase; }

  .badges { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; }
  .b { font-family: var(--font-mono, monospace); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; padding: 3px 7px; text-transform: uppercase; }
  .b.fmt { background: rgba(10,11,13,0.82); border: 1px solid rgba(255,255,255,0.22); color: #fff; }
  .b.src { background: rgba(10,11,13,0.82); border: 1px solid rgba(255,255,255,0.22); color: #fff; }
  .b.src.fresh { border-color: var(--aa-red-600, #c4141d); color: #ff6b6b; }
  .b.id { margin-left: auto; background: rgba(10,11,13,0.82); border: 1px solid rgba(255,255,255,0.18); color: var(--aa-ink-300, #b8bdc6); }
  .b.status { position: absolute; bottom: 8px; left: 8px; }
  .b.status.planned { background: rgba(255,255,255,0.12); color: #d6d9de; }
  .b.status.changes { background: #f59e0b; color: #1a1205; }
  .b.status.approved { background: #4ade80; color: #062911; }
  .b.status.rendered { background: var(--aa-red-600, #c4141d); color: #fff; }

  .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .head { font-family: var(--font-display, sans-serif); font-size: 17px; line-height: 1.12; color: #fff; }
  .micro { font-family: var(--font-mono, monospace); font-size: 10px; letter-spacing: 0.1em; color: var(--aa-red-400, #ff8080); text-transform: uppercase; }
  .vis { font-size: 12px; color: var(--aa-ink-300, #b8bdc6); line-height: 1.35; }
  .tref { font-family: var(--font-mono, monospace); font-size: 10px; color: var(--aa-ink-500, #6b7280); letter-spacing: 0.06em; }
  .flags { display: flex; gap: 5px; flex-wrap: wrap; }
  .flag { font-family: var(--font-mono, monospace); font-size: 9px; letter-spacing: 0.08em; padding: 2px 6px; background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.4); color: #fbbf24; text-transform: uppercase; }
  .rerender { font-family: var(--font-mono, monospace); font-size: 10px; letter-spacing: 0.06em; color: #f59e0b; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
  .rerender::before { content: "●"; font-size: 8px; }
  .note { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-family: var(--font-mono, monospace); font-size: 11px; padding: 7px 9px; resize: vertical; min-height: 34px; }
  .note:focus { outline: none; border-color: var(--aa-red-600, #c4141d); }
  .actions { display: flex; gap: 6px; }
  .act { flex: 1; font-family: var(--font-mono, monospace); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; padding: 8px; cursor: pointer; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.04); color: var(--aa-ink-200, #d6d9de); }
  .act.approve.on { background: #4ade80; border-color: #4ade80; color: #062911; }
  .act.changes.on { background: #f59e0b; border-color: #f59e0b; color: #1a1205; }
  .act.edit { flex: 0 0 auto; }
  .act:hover { border-color: rgba(255,255,255,0.4); }

  .empty { padding: 80px 20px; text-align: center; color: var(--aa-ink-400, #969ca7); font-family: var(--font-mono, monospace); }
  .err { color: #ff6b6b; }

  /* Edit modal — embeds the position editor (static) in an iframe so editing
     happens in place ("one app" feel). */
  .modal-bg { position: fixed; inset: 0; background: rgba(5,6,8,0.86); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-bg.on { display: flex; }
  .modal-card { background: #15171a; border: 1px solid rgba(255,255,255,0.14); width: min(1320px, 96vw); height: 92vh; display: flex; flex-direction: column; }
  .modal-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.1); font-family: var(--font-mono, monospace); font-size: 12px; color: var(--aa-ink-200, #d6d9de); letter-spacing: 0.04em; }
  .modal-head .x { margin-left: auto; cursor: pointer; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); color: #fff; padding: 6px 12px; font-family: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .modal-head .x:hover { border-color: var(--aa-red-600, #c4141d); }
  .modal-body { flex: 1; min-height: 0; }
  .modal-body iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ── Video/gif edit modal (React; namespaced vmodal-* to avoid colliding
        with the static-editor .modal-* above) ── */
  .vmodal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 32px; }
  .vmodal-bg.on { display: flex; }
  .vmodal-card { background: #0f1115; border: 1px solid rgba(255,255,255,0.12); width: min(1180px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .vmodal-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); font-family: var(--font-mono, monospace); font-size: 12px; }
  .vmodal-head .vm-id { background: var(--aa-red-600, #c4141d); color: #fff; padding: 3px 8px; font-weight: 700; }
  .vmodal-head .vm-title { color: var(--aa-ink-300, #b8bdc6); letter-spacing: 0.08em; text-transform: uppercase; }
  .vmodal-head .x { margin-left: auto; cursor: pointer; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); color: #fff; padding: 6px 12px; font-family: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .vmodal-head .x:hover { background: var(--aa-red-600, #c4141d); border-color: var(--aa-red-600, #c4141d); }
  .vmodal-body { display: flex; gap: 18px; padding: 18px; min-height: 0; }
  /* position:relative is load-bearing — the bank's <Stage> root is
     position:absolute;inset:0, so it fills its nearest positioned ancestor.
     Without this it escapes to the viewport. */
  .vmodal-stage { position: relative; width: 360px; flex-shrink: 0; aspect-ratio: 9/16; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .vmodal-stage > * { max-width: 100%; max-height: 100%; }
  /* Drag/resize handles (position tab) — float over the live preview. */
  /* Overlay captures clicks/wheel (the video underneath isn't interactive); a
     click on empty overlay deselects. */
  .vm-drag-overlay { position: absolute; inset: 0; z-index: 20; pointer-events: auto; }
  .vm-handle { position: absolute; border: 1.5px dashed rgba(245,158,11,0.85); cursor: move; pointer-events: auto; box-sizing: border-box; }
  .vm-handle:hover { background: rgba(245,158,11,0.10); }
  .vm-handle.sel { border-style: solid; border-color: #f59e0b; background: rgba(245,158,11,0.14); }
  .vm-handle-tag { position: absolute; top: -14px; left: 0; font-family: var(--font-mono, monospace); font-size: 9px; background: rgba(245,158,11,0.95); color: #0a0b0d; padding: 0 4px; white-space: nowrap; pointer-events: none; }
  .vm-handle-size { position: absolute; top: -16px; right: 0; display: flex; gap: 2px; }
  .vm-handle-size button { width: 18px; height: 16px; padding: 0; font-size: 13px; line-height: 1; background: #f59e0b; color: #0a0b0d; border: none; cursor: pointer; font-family: var(--font-mono, monospace); }
  .vm-fresh { color: var(--aa-ink-400, #969ca7); font-family: var(--font-mono, monospace); font-size: 13px; text-align: center; line-height: 1.5; }
  .vm-fresh span { font-size: 11px; color: var(--aa-ink-500, #6b7280); }
  .vmodal-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .vm-tabs { display: flex; gap: 6px; }
  .vm-tab { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.14); color: var(--aa-ink-300, #b8bdc6); font-family: var(--font-mono, monospace); font-size: 11px; padding: 6px 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; }
  .vm-tab.on { background: var(--aa-red-600, #c4141d); border-color: var(--aa-red-600, #c4141d); color: #fff; }
  .vm-tabbody { flex: 1; overflow-y: auto; min-height: 0; }
  .vm-sub { font-family: var(--font-mono, monospace); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--aa-ink-400, #969ca7); margin: 12px 0 8px; }
  .vm-sub:first-child { margin-top: 0; }
  .vm-swap { margin-bottom: 14px; }
  .vm-swap-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .vm-swap-row span { width: 108px; flex-shrink: 0; font-family: var(--font-mono, monospace); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--aa-ink-400, #969ca7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vm-swap-row select { flex: 1; min-width: 0; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-family: var(--font-mono, monospace); font-size: 11px; padding: 6px 8px; }
  .vm-hint, .vm-note { font-family: var(--font-mono, monospace); font-size: 11px; color: var(--aa-ink-400, #969ca7); line-height: 1.5; padding: 8px 0; }
  .vm-note { color: var(--aa-ink-500, #6b7280); border-top: 1px solid rgba(255,255,255,0.08); margin-top: 10px; }
  .vm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .vm-tile { padding: 0; border: 1px solid rgba(255,255,255,0.14); background: #15171a; cursor: pointer; overflow: hidden; aspect-ratio: 1; }
  .vm-tile.on { border-color: var(--aa-red-600, #c4141d); box-shadow: 0 0 0 1px var(--aa-red-600, #c4141d); }
  .vm-tile img, .vm-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vm-grid-audio { grid-template-columns: 1fr; }
  .vm-grid-audio .vm-tile { aspect-ratio: auto; padding: 8px 10px; text-align: left; }
  .vm-audio-name { font-family: var(--font-mono, monospace); font-size: 11px; color: #fff; }
  .vm-copy label { display: block; font-family: var(--font-mono, monospace); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--aa-ink-300, #b8bdc6); margin-bottom: 12px; }
  .vm-copy input, .vm-copy textarea { display: block; width: 100%; margin-top: 5px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-family: var(--font-mono, monospace); font-size: 12px; padding: 8px 10px; box-sizing: border-box; }
  .vmodal-actions { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
  .vmodal-actions button { flex: 1; font-family: var(--font-mono, monospace); font-size: 12px; font-weight: 600; padding: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: #fff; }
  .vmodal-actions .vm-render { background: var(--aa-red-600, #c4141d); border-color: var(--aa-red-600, #c4141d); }
  .vmodal-actions button:disabled { opacity: 0.6; cursor: wait; }
  /* EditPanel (tp-*) reused from the gallery, flattened to fit the side column */
  .vmodal-side .tp-panel { width: 100%; border: none; background: transparent; max-height: none; }
  .vmodal-side .tp-header, .vmodal-side .tp-footer { display: none; }
  .vmodal-side .tp-fields { padding: 0; }
  .tp-field { margin: 0; }
  .tp-field-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
  .tp-field-label { font-family: var(--font-mono, monospace); font-size: 11px; color: var(--aa-ink-300, #b8bdc6); letter-spacing: 0.14em; text-transform: uppercase; }
  .tp-field-sub { font-family: var(--font-mono, monospace); font-size: 10px; color: var(--aa-ink-500, #6b7280); }
  .tp-input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-family: var(--font-mono, monospace); font-size: 13px; padding: 9px 11px; box-sizing: border-box; }
  .tp-input:focus { outline: none; border-color: var(--aa-red-600, #c4141d); background: rgba(255,255,255,0.06); }
  .tp-textarea { resize: vertical; min-height: 38px; height: 2.6em; line-height: 1.4; }
  .tp-select { appearance: none; padding-right: 28px; }
  .tp-number { font-variant-numeric: tabular-nums; }
  .tp-slider-row { display: flex; align-items: center; gap: 12px; }
  .tp-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: rgba(255,255,255,0.12); outline: none; cursor: pointer; }
  .tp-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: var(--aa-red-600, #c4141d); border: 2px solid #fff; border-radius: 50%; cursor: pointer; }
  .tp-slider::-moz-range-thumb { width: 16px; height: 16px; background: var(--aa-red-600, #c4141d); border-radius: 50%; border: none; cursor: pointer; }
  .tp-slider-value { font-family: var(--font-mono, monospace); font-size: 12px; color: #fff; font-variant-numeric: tabular-nums; width: 48px; text-align: right; }
  .tp-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .tp-swatch { width: 26px; height: 26px; border: 2px solid transparent; border-radius: 3px; cursor: pointer; }
  .tp-swatch.is-active { border-color: #fff; }
  .tp-storage-banner { font-family: var(--font-mono, monospace); font-size: 10px; color: #fbbf24; padding: 6px 0; }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <div class="eyebrow">// Creative Review</div>
      <h1 id="title">Campaign <span class="accent">Plan</span></h1>
    </div>
    <div class="dash" id="dash"></div>
  </div>

  <div class="controls" id="controls"></div>

  <div id="content"><div class="empty">Loading plan…</div></div>
</div>

<!-- Edit modal (static = embedded position editor; video/gif filled by Part 4) -->
<div class="modal-bg" id="editModal">
  <div class="modal-card">
    <div class="modal-head">
      <span id="editModalTitle">Edit</span>
      <button class="x" id="editModalClose">Close</button>
    </div>
    <div class="modal-body" id="editModalBody"></div>
  </div>
</div>

<!-- React root for the video/gif edit modal (Part 4) -->
<div id="videoModalRoot"></div>

<script>
// review.html is served by brand/video-templates/serve.mjs (:5599); the data
// API + render live in editor-server (:5173). Same-origin if you ever serve
// this from editor-server itself.
const API = (location.port === "5599" || location.protocol === "file:")
  ? "http://localhost:5173"
  : "";
const EDITOR = "http://localhost:5173"; // position editor for inline tweaks

const qs = new URLSearchParams(location.search);
const campaignParam = qs.get("campaign") || "";

let PLAN = null;
let FILTER = "all";

const fmtLabel = (f) => ({ video: "VIDEO", gif: "GIF", static: "STATIC" }[f] || f.toUpperCase());

async function load() {
  try {
    const url = API + "/plan" + (campaignParam ? "?campaign=" + encodeURIComponent(campaignParam) : "");
    const r = await fetch(url);
    if (!r.ok) throw new Error("plan " + r.status + " — is editor-server running on :5173?");
    PLAN = await r.json();
    render();
  } catch (e) {
    document.getElementById("content").innerHTML =
      '<div class="empty err">Could not load plan.<br>' + e.message +
      '<br><br>Start it with: <b>node scripts/editor-server.mjs</b></div>';
  }
}

function allAssets() {
  const out = [];
  for (const ang of PLAN.angles || []) for (const a of ang.assets || []) out.push({ ...a, _angle: ang });
  return out;
}

function renderDash() {
  const assets = allAssets();
  const n = assets.length || 1;
  const by = (f) => assets.filter((a) => a.format === f).length;
  const fresh = assets.filter((a) => a.source === "fresh").length;
  const approved = assets.filter((a) => a.status === "approved").length;
  const rendered = assets.filter((a) => a.status === "rendered").length;
  const flags = assets.filter((a) => (a.flags || []).length).length;
  const ratio = (PLAN.knobs && PLAN.knobs.motionRatio) || { video: 0.6, gif: 0.15, static: 0.25 };
  const floor = (PLAN.knobs && PLAN.knobs.freshnessFloor) || 0.45;
  const pct = (x) => Math.round((x / n) * 100);
  const tgt = (k) => Math.round(ratio[k] * 100);
  const freshClass = fresh / n >= floor ? "ok" : "warn";
  const stat = (num, lbl, cls = "") => `<div class="stat"><div class="num ${cls}">${num}</div><div class="lbl">${lbl}</div></div>`;
  document.getElementById("dash").innerHTML =
    stat(assets.length, "assets") +
    stat(`${pct("video")}/${pct("gif")}/${pct("static")}`, `vid/gif/stat · tgt ${tgt("video")}/${tgt("gif")}/${tgt("static")}`) +
    stat(`${pct("video") === undefined ? 0 : Math.round((fresh / n) * 100)}%`, `fresh · floor ${Math.round(floor * 100)}%`, freshClass) +
    stat(`${approved + rendered}/${assets.length}`, "approved", approved + rendered === assets.length ? "ok" : "") +
    stat(flags, "open flags", flags ? "warn" : "ok");
}

function renderControls() {
  const filters = ["all", "video", "gif", "static", "fresh", "template", "needs review"];
  document.getElementById("controls").innerHTML =
    filters.map((f) => `<button class="filt ${FILTER === f ? "on" : ""}" data-f="${f}">${f}</button>`).join("") +
    `<span class="sp"></span><span class="meta">campaign: ${PLAN.campaign} · click a creative's EDIT to open the position editor</span>`;
  document.querySelectorAll(".filt").forEach((b) =>
    b.addEventListener("click", () => { FILTER = b.dataset.f; render(); }));
}

function pass(a) {
  if (FILTER === "all") return true;
  if (FILTER === "fresh") return a.source === "fresh";
  if (FILTER === "template") return a.source === "template";
  if (FILTER === "needs review") return a.status === "planned" || a.status === "changes";
  return a.format === FILTER;
}

// Show the rendered media whenever it EXISTS, decoupled from review status.
// (Bug: flipping status to "changes" used to hide the creative because preview
// was gated on status === "rendered". The output file doesn't disappear when a
// reviewer asks for changes — so neither should the preview.)
function previewHTML(a) {
  const media = a.output || a.thumb;
  if (media) {
    const src = (API ? API : "") + (media.startsWith("/") ? media : "/" + media);
    if (/\.mp4$/i.test(media)) return `<video src="${src}" muted loop autoplay playsinline></video>`;
    return `<img src="${src}" alt="">`; // png/jpg/gif
  }
  // N1 guard: never set an empty/null media src.
  return `<div class="ph"><div class="fmt">${fmtLabel(a.format)}</div><div class="sub">not rendered yet</div></div>`;
}

// An asset whose hand edits are newer than its last render needs a re-render to
// reflect them. Routes stamp editedAt; the runner stamps renderedAt.
function needsRerender(a) {
  if (!a.editedAt) return false;
  if (!a.renderedAt) return true;
  return new Date(a.editedAt).getTime() > new Date(a.renderedAt).getTime();
}

function cardHTML(a) {
  const srcBadge = a.source === "fresh"
    ? `<span class="b src fresh">[F] fresh</span>`
    : `<span class="b src">[T] ${a.template || a.templateQuery || "template"}</span>`;
  const flags = (a.flags || []).map((f) => `<span class="flag">${f}</span>`).join("");
  const tref = a.source === "template" && !a.template && a.templateQuery
    ? `<div class="tref">→ ${a.templateQuery} (to map)</div>` : "";
  return `
  <div class="card s-${a.status}" data-angle="${a._angle.id}" data-asset="${a.id}">
    <div class="prev">
      ${previewHTML(a)}
      <div class="badges"><span class="b fmt">${fmtLabel(a.format)}</span>${srcBadge}<span class="b id">${a.id}</span></div>
      <span class="b status ${a.status}">${a.status}</span>
    </div>
    <div class="body">
      <div class="head">${(a.headline || "").replace(/</g, "&lt;")}</div>
      ${a.microscript ? `<div class="micro">${a.microscript.replace(/</g, "&lt;")}</div>` : ""}
      ${a.visual ? `<div class="vis">${a.visual.replace(/</g, "&lt;")}</div>` : ""}
      ${tref}
      ${flags ? `<div class="flags">${flags}</div>` : ""}
      ${needsRerender(a) ? `<div class="rerender">edited — re-render needed</div>` : ""}
      <textarea class="note" placeholder="notes…">${a.notes || ""}</textarea>
      <div class="actions">
        <button class="act approve ${a.status === "approved" ? "on" : ""}" data-act="approve">Approve</button>
        <button class="act changes ${a.status === "changes" ? "on" : ""}" data-act="changes">Changes</button>
        <button class="act edit" data-act="edit" title="Open in position editor">Edit</button>
      </div>
    </div>
  </div>`;
}

function render() {
  renderDash();
  renderControls();
  const content = document.getElementById("content");
  document.getElementById("title").innerHTML =
    (PLAN.angles && PLAN.angles[0] ? PLAN.angles[0].name : "Campaign") +
    ` <span class="accent">·</span>`;
  let html = "";
  for (const ang of PLAN.angles || []) {
    const beats = {};
    for (const a of ang.assets || []) {
      if (!pass(a)) continue;
      (beats[a.beat || "—"] = beats[a.beat || "—"] || []).push({ ...a, _angle: ang });
    }
    for (const beat of Object.keys(beats)) {
      html += `<div class="beat"><h2>${beat}<span class="ct">${beats[beat].length}</span></h2><div class="grid">`;
      html += beats[beat].map(cardHTML).join("");
      html += `</div></div>`;
    }
  }
  content.innerHTML = html || `<div class="empty">No creatives match this filter.</div>`;
  wire();
}

function wire() {
  document.querySelectorAll(".card").forEach((card) => {
    const angle = card.dataset.angle, asset = card.dataset.asset;
    card.querySelector(".note").addEventListener("change", (e) =>
      patch(angle, asset, { notes: e.target.value }));
    card.querySelectorAll(".act").forEach((btn) =>
      btn.addEventListener("click", () => {
        const act = btn.dataset.act;
        if (act === "edit") {
          const a = findAsset(angle, asset);
          // Static cluster templates → embed the position editor on the asset's
          // OWN campaign config (camp:<campaign>:<angle>:<asset>), not the source
          // template. Video/gif/fresh editing is wired by Part 4.
          if (a && a.format === "static" && a.template && a.template.startsWith("cluster-")) {
            openStaticEditor(angle, asset);
          } else if (window.openVideoEditor) {
            // Video / gif / fresh → the React edit modal (Part 4).
            window.openVideoEditor(angle, asset);
          } else {
            alert("Editor is still loading (template scripts compiling). Try again in a moment.");
          }
          return;
        }
        const cur = findAsset(angle, asset).status;
        const next = act === "approve"
          ? (cur === "approved" ? "planned" : "approved")
          : (cur === "changes" ? "planned" : "changes");
        patch(angle, asset, { status: next });
      }));
  });
}

function findAsset(angleId, assetId) {
  const ang = (PLAN.angles || []).find((a) => a.id === angleId);
  return ang && (ang.assets || []).find((a) => a.id === assetId);
}

async function patch(angleId, assetId, fields) {
  const a = findAsset(angleId, assetId);
  Object.assign(a, fields); // optimistic
  render();
  try {
    const r = await fetch(`${API}/plan/${PLAN.campaign}/${angleId}/${assetId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    });
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    console.error("patch failed", e);
    alert("Save failed: " + e.message);
  }
}

// ── Static edit modal: embed the position editor on the asset's own config ──
function openStaticEditor(angleId, assetId) {
  // The editor lives on :5173 (editor-server). It's cross-origin to this page
  // (:5599) so it can't touch our DOM — it postMessages on render (handled
  // below). camp id = camp:<campaign>:<angle>:<asset>.
  const id = `camp:${PLAN.campaign}:${angleId}:${assetId}`;
  document.getElementById("editModalTitle").textContent =
    `Editing ${assetId} — drag layers, edit text, then Save + Render`;
  document.getElementById("editModalBody").innerHTML =
    `<iframe src="${EDITOR}/editor#${id}" title="position editor"></iframe>`;
  document.getElementById("editModal").classList.add("on");
}
function closeEditModal() {
  document.getElementById("editModal").classList.remove("on");
  document.getElementById("editModalBody").innerHTML = ""; // unload the iframe
  load(); // refresh cards — picks up any edits/renders made in the editor
}
document.getElementById("editModalClose").addEventListener("click", closeEditModal);
// B4: the editor iframe postMessages when a single-asset render finishes so we
// can refresh that card's thumb without cross-origin DOM access.
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "camp-rendered") load();
});

// Bridge so the React video modal (a separate babel script) can read the plan,
// resolve assets, and trigger a refresh without re-implementing any of it.
window.ReviewBridge = {
  API,
  getPlan: () => PLAN,
  findAsset,
  reload: load,
};

load();
</script>

const { useState, useEffect } = React;
const apiBase = () => (window.ReviewBridge && window.ReviewBridge.API) || "";

function defaultsFromFields(fields) {
  const d = {};
  for (const f of fields || []) if (f.default !== undefined) d[f.key] = f.default;

}

// Map a field key to the relevant campaign value pool (mirrors the static
// editor's valuesForTag): eyebrow/micro-ish → microscripts, title/head-ish →
// headlines, plus values other assets used for the exact same key.
function valuesForKey(key, vals) {
  if (!vals) return [];
  const t = String(key || "").toLowerCase();
  let pool = [];
  if (/eyebrow|micro|byline|attribution|credential|role|label|tag/.test(t)) pool = vals.microscript || [];
  else if (/title|head|quote|claim|primary|cta|tagline|subtext|name/.test(t)) pool = vals.headline || [];
  const keyed = (vals.byKey && vals.byKey[key]) || [];
  return [...new Set([...keyed, ...pool])];
}

// Quick-swap: per copy field, a dropdown of campaign values to drop in.

// Drag/resize overlay: floats handles over each retrofitted [data-ov-key] text
// node in the live preview. A rAF loop re-measures every frame so handles track
// the animating text. Dragging writes data._overrides[key] {dx,dy} (move) or
// {fontSize} (resize); TplText re-applies it live (preview == render).
function DragOverlay({ stageRef, data, setOverride, selected, setSelected }) {
  const [boxes, setBoxes] = useState([]);
  const boxesRef = React.useRef([]);
  const dragRef = React.useRef(null);

  // rAF loop: re-measure every [data-ov-key] node so handles track the animation.
  useEffect(() => {
    let raf;
    const tick = () => {
      const stage = stageRef.current;
      if (stage) {
        const sRect = stage.getBoundingClientRect();
        const canvas = [...stage.querySelectorAll("div")].find((d) => d.offsetWidth === 1080 && d.offsetHeight === 1920);
        const scale = canvas ? canvas.getBoundingClientRect().width / 1080 : 1;
        const nodes = [...stage.querySelectorAll("[data-ov-key]")];
        const next = nodes.map((n) => {
          const r = n.getBoundingClientRect();
          return {
            key: n.getAttribute("data-ov-key"),
            left: r.left - sRect.left, top: r.top - sRect.top, w: r.width, h: r.height,
            fontPx: parseFloat(getComputedStyle(n).fontSize) || 0, scale,
          };
        });
        boxesRef.current = next;
        setBoxes(next);
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [stageRef]);

  // Current effective design font size for a key (hand-set override, else the
  // measured rendered size ÷ scale).
  const sizeOf = (key) => {
    const ov = (data._overrides && data._overrides[key]) || {};
    if (ov.fontSize != null) return ov.fontSize;
    // getComputedStyle().fontSize is already in DESIGN px — CSS transforms (the
    // canvas scale) don't change computed values — so do NOT divide by scale.
    const b = boxesRef.current.find((x) => x.key === key);
    return b ? Math.round(b.fontPx) : 40;
  };
  const bump = (keys, delta) => keys.forEach((k) => setOverride(k, { fontSize: Math.max(12, sizeOf(k) + delta) }));

  // group move
  useEffect(() => {
    const onMove = (e) => {
      const d = dragRef.current; if (!d) return;
      const ddx = (e.clientX - d.startX) / d.scale;
      const ddy = (e.clientY - d.startY) / d.scale;
      d.items.forEach((it) => setOverride(it.key, { dx: Math.round(it.baseDx + ddx), dy: Math.round(it.baseDy + ddy) }));
    };
    const onUp = () => { dragRef.current = null; };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
  }, [setOverride]);

  // keyboard +/- resizes the selection (mirrors the static editor)
  useEffect(() => {
    const onKey = (e) => {
      if (!selected.length) return;
      if (e.key === "+" || e.key === "=") { e.preventDefault(); bump(selected, 4); }
      else if (e.key === "-" || e.key === "_") { e.preventDefault(); bump(selected, -4); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [selected, data, setOverride]);

  const startMove = (b, e) => {
    e.preventDefault(); e.stopPropagation();
    if (e.shiftKey) { // toggle membership, no drag
      setSelected(selected.includes(b.key) ? selected.filter((k) => k !== b.key) : [...selected, b.key]);
      return;
    }
    let sel = selected;
    if (!selected.includes(b.key)) { sel = [b.key]; setSelected(sel); }
    dragRef.current = {
      startX: e.clientX, startY: e.clientY, scale: b.scale || 1,
      items: sel.map((k) => { const ov = (data._overrides && data._overrides[k]) || {}; return { key: k, baseDx: ov.dx || 0, baseDy: ov.dy || 0 }; }),
    };
  };

  return (
    <div className="vm-drag-overlay"
      onWheel={(e) => { if (selected.length) { e.preventDefault(); bump(selected, e.deltaY < 0 ? 4 : -4); } }}
      onMouseDown={(e) => { if (e.target.classList.contains("vm-drag-overlay")) setSelected([]); }}>
      {boxes.map((b) => (
        <div key={b.key} className={"vm-handle" + (selected.includes(b.key) ? " sel" : "")}
          style={{ left: b.left, top: b.top, width: b.w, height: b.h }}
          onMouseDown={(e) => startMove(b, e)}
          title="Drag to move · shift-click to group · wheel or ± to resize">
          <span className="vm-handle-tag">{b.key}</span>
          {selected.includes(b.key) && (
            <div className="vm-handle-size">
              <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); bump([b.key], -4); }}>−</button>
              <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); bump([b.key], 4); }}>+</button>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

  const [spec, setSpec] = useState(null);

  const [data, setData] = useState(() => ({ ...((asset && asset.templateData) || {}) }));

  const [clip, setClip] = useState(asset ? asset.clip || null : null);
  const [audio, setAudio] = useState(asset ? asset.audio || null : null);
  const [headline, setHeadline] = useState(asset ? asset.headline || "" : "");
  const [microscript, setMicroscript] = useState(asset ? asset.microscript || "" : "");
  const [notes, setNotes] = useState(asset ? asset.notes || "" : "");
  const [busy, setBusy] = useState(null);
  const [tab, setTab] = useState("copy");

  useEffect(() => {
    fetch(apiBase() + "/bank?type=motion").then((r) => r.json())
      .then((j) => setBank(j.templates || [])).catch(() => {});
  }, []);

  useEffect(() => {
    if (!template) { setSpec(null); return; }
    let live = true;
    fetch(apiBase() + "/template-spec/" + template).then((r) => r.json()).then((j) => {
      if (!live) return;
      setSpec(j);
      // Carry existing copy by matching key (best-match), seed new keys from
      // defaults; unknown old keys are ignored by the component (no silent loss).
      setData((prev) => ({ ...defaultsFromFields(j.fields), ...prev }));
    }).catch(() => { if (live) setSpec({ fields: [], component: null }); });
    return () => { live = false; };
  }, [template]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  const setField = (k, v) => setData((d) => ({ ...d, [k]: v }));
  const setFields = (patch) => setData((d) => ({ ...d, ...patch }));
  const reset = () => setData(spec ? defaultsFromFields(spec.fields) : {});

  const stageRef = React.useRef(null);
  const [selected, setSelected] = useState([]); // ov-keys selected in the Position tab
  // H2: init _overrides defensively so the first-ever drag can't throw on undefined.
  const setOverride = (key, patch) => setData((d) => ({
    ...d,
    _overrides: { ...(d._overrides || {}), [key]: { ...((d._overrides || {})[key] || {}), ...patch } },
  }));
  const resetOverrides = () => setData((d) => { const n = { ...d }; delete n._overrides; return n; });
  // Add a free text box: a new editable field (data[key]) + an _extras entry
  // (ExtrasLayer renders it; it gets a handle + a COPY field automatically).
  const addText = () => setData((d) => {
    const extras = d._extras || [];
    const key = "extra_" + Date.now().toString(36);
    return {
      ...d,
      _extras: [...extras, { key, label: "Added text " + (extras.length + 1), x: 120, y: 420 + extras.length * 90, fontSize: 72 }],
      [key]: "NEW TEXT",
    };
  });
  const removeExtra = (key) => setData((d) => {
    const n = { ...d, _extras: (d._extras || []).filter((e) => e.key !== key) };
    delete n[key];
    if (n._overrides) { const ov = { ...n._overrides }; delete ov[key]; n._overrides = ov; }
    return n;
  });

  const fields = (spec && spec.fields) || [];
  // Added text boxes (data._extras) join the editable field list, so they show
  // up in the COPY tab + swap dropdown exactly like the template's own fields.
  const extraFields = (data._extras || []).map((e) => ({ key: e.key, label: e.label || "Added text", type: "text" }));
  // Render text fields as textareas so Enter inserts a line break; TplText shows
  // the \n (white-space: pre-line). Mirrors the static editor's newline support.
  const multiline = (f) => (f.type === "text" ? { ...f, type: "textarea" } : f);
  const copyFields = [...fields.filter((f) => f.type !== "image").map(multiline), ...extraFields.map(multiline)];
  const imageFields = fields.filter((f) => f.type === "image");
  const imageKey = imageFields.length ? imageFields[0].key : null;
  const Comp = spec && spec.component ? window[spec.component] : null;

  const pickPhoto = (it) => { setPhoto(it.path); setClip(null); if (imageKey) setField(imageKey, apiBase() + it.url); };
  const pickClip  = (it) => { setClip(it.path); setPhoto(null); if (imageKey) setField(imageKey, apiBase() + it.url); };
  const pickAudio = (it) => setAudio({ src: it.path, startAt: 0, volume: 1 });

  async function save(render) {
    setBusy(render ? "Rendering…" : "Saving…");
    const patch = isFresh
      ? { headline, microscript, notes }
      : { templateData: data, template,
          ...(photo ? { photo } : {}), ...(clip ? { clip } : {}), ...(audio ? { audio } : {}) };
    try {
      // B7: await the /plan patch before render (the runner reads the plan from
      // disk at start), so the render never picks up stale copy.
      const r = await fetch(`${apiBase()}/plan/${plan.campaign}/${angleId}/${assetId}`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch),
      });
      if (!r.ok) throw new Error(await r.text());
      if (render && !isFresh) {
        const rr = await fetch(`${apiBase()}/render-asset/${plan.campaign}/${angleId}/${assetId}`, { method: "POST" });
        const rj = await rr.json();
        if (rj.exitCode !== 0) throw new Error((rj.stderr || "render failed").slice(-200));
      }
      setBusy(null); bridge.reload(); onClose();
    } catch (e) {
      setBusy(null);
      alert((render ? "Render" : "Save") + " failed: " + e.message);
    }
  }

  return (
    <div className="vmodal-bg on" onClick={onClose}>
      <div className="vmodal-card" onClick={(e) => e.stopPropagation()}>
        <div className="vmodal-head">
          <span className="vm-id">{assetId}</span>
          <span className="vm-title">{isFresh ? "Fresh creative — copy only" : ((asset.format || "video").toUpperCase() + " · " + template)}</span>
          <button className="x" onClick={onClose}>Close</button>
        </div>
        <div className="vmodal-body">
          <div className="vmodal-stage" ref={stageRef}>
            {isFresh
              ? <div className="vm-fresh">Fresh render pending<br/><span>(compose-creative not built yet)</span></div>
              : (Comp && window.Stage
                  ? <window.Stage key={template + ":" + (Number(data.duration) || 8)}
                      width={1080} height={1920} duration={Number(data.duration) || 8}
                      background="#0a0b0d" autoplay loop>
                      <Comp data={data} />
                      {window.ExtrasLayer && <window.ExtrasLayer data={data} />}
                    </window.Stage>
                  : <div className="vm-fresh">Loading preview…</div>)}
            {!isFresh && tab === "position" && Comp && window.Stage &&
              <DragOverlay stageRef={stageRef} data={data} setOverride={setOverride}
                selected={selected} setSelected={setSelected} />}
          </div>
          <div className="vmodal-side">
            {isFresh ? (
              <div className="vm-copy">
                <label>Headline<textarea value={headline} onChange={(e) => setHeadline(e.target.value)} rows={3} /></label>
                <label>Microscript<input value={microscript} onChange={(e) => setMicroscript(e.target.value)} /></label>
                <label>Notes<textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} /></label>
                <div className="vm-note">Fresh assets render once compose-creative ships. Copy is saved to the plan now.</div>
              </div>
            ) : (
              <React.Fragment>
                <div className="vm-tabs">
                  {["copy", "media", "audio", "swap", "position"].map((t) =>
                    <button key={t} className={"vm-tab" + (tab === t ? " on" : "")} onClick={() => setTab(t)}>{t}</button>)}
                </div>
                <div className="vm-tabbody">
                  {tab === "copy" && (window.EditPanel
                    ? <React.Fragment>
                        <CampaignSwap fields={copyFields} setField={setField} campaign={plan.campaign} />
                        <window.EditPanel spec={{ id: template, name: template, fields: copyFields }}
                          data={data} setField={setField} setFields={setFields} reset={reset}
                          templateDuration={Number(data.duration) || 8} />
                      </React.Fragment>
                    : <div className="vm-hint">Loading editor…</div>)}
                  {tab === "media" && (imageKey
                    ? <React.Fragment>
                        <div className="vm-sub">Photo</div><MediaPicker kind="photo" current={photo} onPick={pickPhoto} />
                        <div className="vm-sub">Clip</div><MediaPicker kind="clip" current={clip} onPick={pickClip} />
                      </React.Fragment>
                    : <div className="vm-hint">This template has no photo/clip slot.</div>)}
                  {tab === "audio" && <React.Fragment>
                    <MediaPicker kind="audio" current={audio && audio.src} onPick={pickAudio} />
                    <div className="vm-note">Audio choice persists but the render is silent for now (mux deferred).</div>
                  </React.Fragment>}
                  {tab === "swap" && <React.Fragment>
                    <div className="vm-sub">Swap template</div>
                    <select className="tp-input tp-select" value={template || ""} onChange={(e) => setTemplate(e.target.value)}>
                      {bank.map((t) => <option key={t} value={t}>{t}</option>)}
                    </select>
                    <div className="vm-note">Switching carries copy by matching field name; re-check fields after a swap.</div>
                  </React.Fragment>}
                  {tab === "position" && <React.Fragment>
                    <div className="vm-sub">Move &amp; resize text{selected.length ? ` · ${selected.length} selected` : ""}</div>
                    <div className="vm-hint">Click a highlighted element to select; <b>shift-click</b> to add more and move them together. <b>Drag</b> to move. <b>Scroll-wheel</b>, the <b>± buttons</b>, or <b>+/−</b> keys resize the selection (a hand-set size wins — text grows past its box if you push it; auto-fit only pre-sizes text you haven't touched). Edit any text in the <b>COPY</b> tab.</div>
                    <button className="vm-tab" style={{ marginTop: 8 }} onClick={addText}>+ Add text</button>
                    {(data._extras || []).length > 0 && <React.Fragment>
                      <div className="vm-sub">Added text boxes</div>
                      {(data._extras || []).map((e) => (
                        <div key={e.key} className="vm-swap-row">
                          <span>{(data[e.key] || e.label || "").slice(0, 22)}</span>
                          <button className="vm-tab" onClick={() => removeExtra(e.key)}>✕ remove</button>
                        </div>
                      ))}
                    </React.Fragment>}
                    <button className="vm-tab" style={{ marginTop: 10 }} onClick={() => { resetOverrides(); setSelected([]); }}>Reset all positions &amp; sizes</button>
                  </React.Fragment>}
                </div>
              </React.Fragment>
            )}
            <div className="vmodal-actions">
              <button className="vm-save" disabled={!!busy} onClick={() => save(false)}>{busy || "Save"}</button>
              {!isFresh && <button className="vm-render" disabled={!!busy} onClick={() => save(true)}>{busy || "Save + Re-render"}</button>}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

const _vmRoot = ReactDOM.createRoot(document.getElementById("videoModalRoot"));
function renderVideoModal(props) {
  _vmRoot.render(props ? <VideoEditModal {...props} onClose={() => renderVideoModal(null)} /> : null);
}
// Called by the vanilla card "Edit" handler for video/gif/fresh assets.
window.openVideoEditor = (angleId, assetId) => renderVideoModal({ angleId, assetId });
</script>
</body>
</html>
