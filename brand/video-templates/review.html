// Nested folder tree, built client-side from the flat /kraken/folders list.
function FolderTree({ nodes, picked, setPicked, expanded, setExpanded, depth }) {
  return (
    <React.Fragment>
      {nodes.map((n) => (
        <div key={n.id}>
          <div className={"kbar-folder" + (picked && picked.id === n.id ? " on" : "")}
            style={{ paddingLeft: 6 + depth * 14 }}>
            {n.children.length > 0
              ? <span className="kbar-tw" onClick={() => setExpanded((x) => ({ ...x, [n.id]: !x[n.id] }))}>{expanded[n.id] ? "▾" : "▸"}</span>
              : <span className="kbar-tw" />}
            <span className="kbar-fname" onClick={() => setPicked({ id: n.id, name: n.name })} title={n.name}>{n.name}</span>
          </div>
          {n.children.length > 0 && expanded[n.id] &&
            <FolderTree nodes={n.children} picked={picked} setPicked={setPicked}
              expanded={expanded} setExpanded={setExpanded} depth={depth + 1} />}
        </div>
      ))}
    </React.Fragment>
  );
}

// The campaign-level Kraken bar: pick an AA location, browse its folder tree,
// pull a folder's media into THIS campaign, or upload from the computer. Calls
// onChanged() after a pull/upload so the MediaPickers refetch. Hidden when there
// is no campaign (a per-campaign pull would be meaningless).
function KrakenBar({ campaign, onChanged, onUploaded, onPlaced }) {
  const [workspaces, setWorkspaces] = useState(null);
  const [ws, setWs] = useState("");
  const [folders, setFolders] = useState(null);
  const [expanded, setExpanded] = useState({});
  const [picked, setPicked] = useState(null);
  const [busy, setBusy] = useState(null);
  const [msg, setMsg] = useState("");
  const fileRef = React.useRef(null);
  const [files, setFiles] = useState(null);     // media items WITHIN the picked folder (per-file pull)
  const [filesBusy, setFilesBusy] = useState(false);
  const [fileFilter, setFileFilter] = useState("");

  // Workspaces + the campaign's saved default location, in parallel.
  useEffect(() => {
    let live = true;
    Promise.all([
      fetch(apiBase() + "/kraken/workspaces").then((r) => r.json()).catch(() => ({ workspaces: [] })),
      fetch(apiBase() + "/kraken/state?campaign=" + encodeURIComponent(campaign)).then((r) => r.json()).catch(() => ({})),
    ]).then(([wj, sj]) => {
      if (!live) return;
      const list = wj.workspaces || [];
      setWorkspaces(list);
      if (sj && sj.sourceFolder) setMsg("Source: " + sj.sourceFolder);
      // Match on the saved UUID first — the sidecar stores an alias ("genesis")
      // that won't equal the dropdown's canonical name ("genesis-sports-performance").
      const def = list.find((w) => w.id === (sj && sj.workspaceId)) ||
                  list.find((w) => w.name === (sj && sj.workspace)) ||
                  list.find((w) => w.id === (sj && sj.workspace)) || null;
      if (def) setWs(def.id);
    });
    return () => { live = false; };
  }, [campaign]);

  // Folders for the selected workspace.
  useEffect(() => {
    if (!ws) { setFolders(null); return; }
    let live = true;
    setFolders(null);
    fetch(apiBase() + "/kraken/folders?workspace=" + encodeURIComponent(ws))
      .then((r) => r.json()).then((j) => { if (live) setFolders(j.folders || []); })
      .catch(() => { if (live) setFolders([]); });
    return () => { live = false; };
  }, [ws]);

  // The media FILES inside the picked folder (per-file pull). Lazy — only the
  // currently-picked folder, fetched once per pick.
  useEffect(() => {
    if (!ws || !picked) { setFiles(null); return; }
    let live = true;
    setFiles(null); setFilesBusy(true); setFileFilter("");
    const wsName = (workspaces || []).find((w) => w.id === ws);
    const q = "/kraken/files?workspace=" + encodeURIComponent((wsName && wsName.name) || ws) +
      "&folder=" + encodeURIComponent(picked.id);
    fetch(apiBase() + q)
      .then((r) => r.json()).then((j) => { if (live) setFiles(j.files || []); })
      .catch(() => { if (live) setFiles([]); })
      .then(() => { if (live) setFilesBusy(false); });
    return () => { live = false; };
  }, [ws, picked]);

  // Flat → nested. Orphans (parent not in the set) surface at root so nothing hides.
  const tree = React.useMemo(() => {
    const list = folders || [];
    const byId = new Map(list.map((f) => [f.id, { ...f, children: [] }]));
    const roots = [];
    for (const f of byId.values()) {
      const parent = f.parent_id && byId.get(f.parent_id);
      if (parent) parent.children.push(f); else roots.push(f);
    }
    const sortRec = (ns) => { ns.sort((a, b) => a.name.localeCompare(b.name)); ns.forEach((n) => sortRec(n.children)); };
    sortRec(roots);
    return roots;
  }, [folders]);

  // NOTE: whole-folder "Pull" was removed from the UI — it bulk-downloaded every
  // file (e.g. IG Stories = 207 videos) and hung. Browse the folder's thumbnails
  // and click ONE to place it (pullFile → /kraken/pull-file downloads just that
  // file). The /kraken/pull endpoint still exists for CLI/bulk use.

  async function upload(files) {
    if (!campaign || !files || !files.length) return;
    setBusy("Uploading " + files.length + " file(s)…");
    let ok = 0, fail = 0, lastErr = "";
    const uploaded = [];
    for (const f of files) {
      const ext = "." + (f.name.split(".").pop() || "").toLowerCase();
      const kind = [".mp4", ".mov", ".webm"].includes(ext) ? "clip"
        : [".mp3", ".wav", ".m4a", ".aac", ".ogg"].includes(ext) ? "audio" : "photo";
      try {
        const q = `/media-upload?campaign=${encodeURIComponent(campaign)}&kind=${kind}&name=${encodeURIComponent(f.name)}`;
        const r = await fetch(apiBase() + q, { method: "POST", body: f });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || "upload failed");
        uploaded.push({ name: j.name || f.name, path: j.path, url: j.url, source: "uploaded", kind });
        ok++;
      } catch (e) { console.error("[upload]", f.name, e); fail++; lastErr = e.message || String(e); }
    }
    setMsg(`Uploaded ${ok} file(s)${fail ? `, ${fail} failed: ${lastErr}` : ""}`);
    if (fileRef.current) fileRef.current.value = "";
    setBusy(null);
    onChanged();
    // Auto-place the uploaded file(s) so "upload" actually applies (the parent
    // routes by kind → pickPhoto/pickClip/pickAudio, which set the clip/photo
    // STATE the renderer reads — not just the preview field).
    if (uploaded.length && onUploaded) onUploaded(uploaded);
  }

  // Per-file pull: pull ONE content item from the picked folder and place it
  // directly (no whole-folder pull). The server returns the cached relative path
  // + the durable Kraken ref; the parent places it by kind via onPlaced.
  async function pullFile(file) {
    if (!campaign || !ws || !picked) return;
    setBusy("Placing " + (file.title || file.id) + "…");
    try {
      const wsName = ((workspaces || []).find((w) => w.id === ws) || {}).name || ws;
      const r = await fetch(apiBase() + "/kraken/pull-file", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ campaign, workspace: wsName, folder: picked.id, file: file.id }),
      });
      const j = await r.json();
      if (!r.ok || !j.file) throw new Error(j.error || (j.stderr || "").slice(-160) || "pull failed");
      setMsg("Placed " + (j.file.title || j.file.name));
      onChanged();
      if (onPlaced) onPlaced(j.file);
    } catch (e) { setMsg("Place failed: " + e.message); }
    setBusy(null);
  }

  if (!campaign) return null;

  return (
    <div className="kbar">
      <div className="kbar-row">
        <select className="tp-input tp-select" value={ws}
          onChange={(e) => { setWs(e.target.value); setPicked(null); setExpanded({}); }}>
          <option value="">{workspaces === null ? "Loading locations…" : (workspaces.length ? "— AA location —" : "No locations configured")}</option>
          {(workspaces || []).map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
        </select>
        <button className="vm-tab" disabled={!!busy} onClick={() => fileRef.current && fileRef.current.click()}>Upload</button>
        <input ref={fileRef} type="file" multiple style={{ display: "none" }}
          accept="image/*,video/*,audio/*" onChange={(e) => upload([...e.target.files])} />
      </div>
      {ws && (
        <div className="kbar-tree">
          {folders === null ? <div className="vm-hint">Loading folders…</div>
            : !tree.length ? <div className="vm-hint">No folders in this location.</div>
              : <FolderTree nodes={tree} picked={picked} setPicked={setPicked} expanded={expanded} setExpanded={setExpanded} depth={0} />}
        </div>
      )}
      {picked && (
        <div className="kbar-files">
          {filesBusy ? <div className="vm-hint">Loading files in {picked.name}…</div>
            : files === null ? null
              : !files.length ? <div className="vm-hint">No image/video files in "{picked.name}".</div>
                : (() => {
                    const q = fileFilter.trim().toLowerCase();
                    const shown = q ? files.filter((f) => (f.title || "").toLowerCase().includes(q)) : files;
                    return (
                      <React.Fragment>
                        <input type="text" value={fileFilter} onChange={(e) => setFileFilter(e.target.value)}
                          placeholder={"Click a file to place it · filter " + files.length + " in " + picked.name + "…"}
                          style={{ width: "100%", margin: "6px 0", padding: "5px 8px", fontSize: 12,
                            background: "#15171a", color: "#e6e8ea", border: "1px solid #2a2d31", borderRadius: 4 }} />
                        <div className="vm-grid vm-grid-clip" style={{ maxHeight: 240, overflowY: "auto" }}>
                          {shown.map((f) => (
                            <button key={f.id} type="button" className="vm-tile" disabled={!!busy}
                              title={f.title || f.id} onClick={() => pullFile(f)}>
                              <span className="vm-srcbadge kraken">{f.type === "video" ? "vid" : "img"}</span>
                              {f.type === "image" && f.url
                                ? <img src={f.url} alt="" loading="lazy" />
                                : <video src={f.url} muted preload="none" />}
                              <span style={{ position: "absolute", left: 0, right: 0, bottom: 0, padding: "2px 4px",
                                fontSize: 9, lineHeight: 1.2, color: "#cfd2d6", background: "rgba(10,11,13,0.78)",
                                whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{f.title || f.id}</span>
                            </button>
                          ))}
                          {!shown.length && <div className="vm-hint">No file matches "{fileFilter}".</div>}
                        </div>
                      </React.Fragment>
                    );
                  })()}
        </div>
      )}
      {(busy || msg) && <div className="kbar-msg">{busy || msg}</div>}
    </div>
  );
}

// Drag/resize overlay: floats handles over each retrofitted [data-ov-key] text
// node in the live preview. A rAF loop re-measures every frame so handles track
// the animating text. Dragging writes data._overrides[key] {dx,dy} (move) or
// {fontSize} (resize); TplText re-applies it live (preview == render).
function DragOverlay({ stageRef, data, setOverride, selected, setSelected }) {
  const [boxes, setBoxes] = useState([]);
  const boxesRef = React.useRef([]);
  const dragRef = React.useRef(null);

  // rAF loop: re-measure every [data-ov-key] node so handles track the animation.
  useEffect(() => {
    let raf;
    const tick = () => {
      const stage = stageRef.current;
      if (stage) {
        const sRect = stage.getBoundingClientRect();
        const canvas = [...stage.querySelectorAll("div")].find((d) => d.offsetWidth === 1080 && d.offsetHeight === 1920);
        const scale = canvas ? canvas.getBoundingClientRect().width / 1080 : 1;
        const nodes = [...stage.querySelectorAll("[data-ov-key]")];
        const next = nodes.map((n) => {
          const r = n.getBoundingClientRect();
          return {
            key: n.getAttribute("data-ov-key"),
            left: r.left - sRect.left, top: r.top - sRect.top, w: r.width, h: r.height,
            fontPx: parseFloat(getComputedStyle(n).fontSize) || 0, scale,
          };
        });
        boxesRef.current = next;
        setBoxes(next);
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [stageRef]);

  // Current effective design font size for a key (hand-set override, else the
  // measured rendered size ÷ scale).
  const sizeOf = (key) => {
    const ov = (data._overrides && data._overrides[key]) || {};
    if (ov.fontSize != null) return ov.fontSize;
    // getComputedStyle().fontSize is already in DESIGN px — CSS transforms (the
    // canvas scale) don't change computed values — so do NOT divide by scale.
    const b = boxesRef.current.find((x) => x.key === key);
    return b ? Math.round(b.fontPx) : 40;
  };
  const bump = (keys, delta) => keys.forEach((k) => setOverride(k, { fontSize: Math.max(12, sizeOf(k) + delta) }));

  // group move
  useEffect(() => {
    const onMove = (e) => {
      const d = dragRef.current; if (!d) return;
      const ddx = (e.clientX - d.startX) / d.scale;
      const ddy = (e.clientY - d.startY) / d.scale;
      d.items.forEach((it) => setOverride(it.key, { dx: Math.round(it.baseDx + ddx), dy: Math.round(it.baseDy + ddy) }));
    };
    const onUp = () => { dragRef.current = null; };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
  }, [setOverride]);

  // keyboard +/- resizes the selection (mirrors the static editor)
  useEffect(() => {
    const onKey = (e) => {
      if (!selected.length) return;
      if (e.key === "+" || e.key === "=") { e.preventDefault(); bump(selected, 4); }
      else if (e.key === "-" || e.key === "_") { e.preventDefault(); bump(selected, -4); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [selected, data, setOverride]);

  const startMove = (b, e) => {
    e.preventDefault(); e.stopPropagation();
    if (e.shiftKey) { // toggle membership, no drag
      setSelected(selected.includes(b.key) ? selected.filter((k) => k !== b.key) : [...selected, b.key]);
      return;
    }
    let sel = selected;
    if (!selected.includes(b.key)) { sel = [b.key]; setSelected(sel); }
    dragRef.current = {
      startX: e.clientX, startY: e.clientY, scale: b.scale || 1,
      items: sel.map((k) => { const ov = (data._overrides && data._overrides[k]) || {}; return { key: k, baseDx: ov.dx || 0, baseDy: ov.dy || 0 }; }),
    };
  };

  return (
    <div className="vm-drag-overlay"
      onWheel={(e) => { if (selected.length) { e.preventDefault(); bump(selected, e.deltaY < 0 ? 4 : -4); } }}
      onMouseDown={(e) => { if (e.target.classList.contains("vm-drag-overlay")) setSelected([]); }}>
      {boxes.map((b) => (
        <div key={b.key} className={"vm-handle" + (selected.includes(b.key) ? " sel" : "")}
          style={{ left: b.left, top: b.top, width: b.w, height: b.h }}
          onMouseDown={(e) => startMove(b, e)}
          title="Drag to move · shift-click to group · wheel or ± to resize">
          <span className="vm-handle-tag">{b.key}</span>
          {selected.includes(b.key) && (
            <div className="vm-handle-size">
              <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); bump([b.key], -4); }}>−</button>
              <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); bump([b.key], 4); }}>+</button>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function VideoEditModal({ angleId, assetId, onClose }) {
  const bridge = window.ReviewBridge;
  const plan = bridge.getPlan();
  const asset = bridge.findAsset(angleId, assetId);
  const isFresh = !asset || asset.source === "fresh" || !asset.template;

  const [template, setTemplate] = useState(asset ? asset.template : null);
  const [spec, setSpec] = useState(null);
  const [bank, setBank] = useState([]);
  const [data, setData] = useState(() => ({ ...((asset && asset.templateData) || {}) }));
  const [photo, setPhoto] = useState(asset ? asset.photo || null : null);
  const [clip, setClip] = useState(asset ? asset.clip || null : null);
  const [audio, setAudio] = useState(asset ? asset.audio || null : null);
  const [headline, setHeadline] = useState(asset ? asset.headline || "" : "");
  const [microscript, setMicroscript] = useState(asset ? asset.microscript || "" : "");
  const [notes, setNotes] = useState(asset ? asset.notes || "" : "");
  const [busy, setBusy] = useState(null);
  const [tab, setTab] = useState("copy");
  const [outVer, setOutVer] = useState(0); // cache-bust the rendered-output preview after a re-render
  const [mediaReload, setMediaReload] = useState(0); // bump → MediaPickers refetch after a Kraken pull/upload

  useEffect(() => {
    fetch(apiBase() + "/bank?type=motion").then((r) => r.json())
      .then((j) => setBank(j.templates || [])).catch(() => {});
  }, []);

  const [compReady, setCompReady] = useState(0); // bump to re-render once a lazily-loaded component registers
  useEffect(() => {
    if (!template) { setSpec(null); return; }
    let live = true;
    fetch(apiBase() + "/template-spec/" + template).then((r) => r.json()).then((j) => {
      if (!live) return;
      setSpec(j);
      // Carry existing copy by matching key (best-match), seed new keys from
      // defaults; unknown old keys are ignored by the component (no silent loss).
      setData((prev) => ({ ...defaultsFromFields(j.fields), ...prev }));
      // Lazily load the component if its window global isn't registered yet
      // (campaign-composed templates aren't in the page's hardcoded script list).
      if (j.component && !window[j.component]) {
        ensureComponent(j.template || template, j.component)
          .then(() => { if (live) setCompReady((n) => n + 1); })
          .catch((e) => { if (live) { console.error("template load failed:", e); setCompReady((n) => n + 1); } });
      }
    }).catch(() => { if (live) setSpec({ fields: [], component: null }); });
    return () => { live = false; };
  }, [template]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  const setField = (k, v) => setData((d) => ({ ...d, [k]: v }));
  const setFields = (patch) => setData((d) => ({ ...d, ...patch }));
  const reset = () => setData(spec ? defaultsFromFields(spec.fields) : {});

  const stageRef = React.useRef(null);
  const [selected, setSelected] = useState([]); // ov-keys selected in the Position tab
  // H2: init _overrides defensively so the first-ever drag can't throw on undefined.
  const setOverride = (key, patch) => setData((d) => ({
    ...d,
    _overrides: { ...(d._overrides || {}), [key]: { ...((d._overrides || {})[key] || {}), ...patch } },
  }));
  const resetOverrides = () => setData((d) => { const n = { ...d }; delete n._overrides; return n; });
  // Add a free text box: a new editable field (data[key]) + an _extras entry
  // (ExtrasLayer renders it; it gets a handle + a COPY field automatically).
  const addText = () => setData((d) => {
    const extras = d._extras || [];
    const key = "extra_" + Date.now().toString(36);
    return {
      ...d,
      _extras: [...extras, { key, label: "Added text " + (extras.length + 1), x: 120, y: 420 + extras.length * 90, fontSize: 72 }],
      [key]: "NEW TEXT",
    };
  });
  const removeExtra = (key) => setData((d) => {
    const n = { ...d, _extras: (d._extras || []).filter((e) => e.key !== key) };
    delete n[key];
    if (n._overrides) { const ov = { ...n._overrides }; delete ov[key]; n._overrides = ov; }
    return n;
  });

  // ── Undo / redo: a debounced history of the whole `data` object. Rapid
  // changes within 450ms (typing, a drag) coalesce into ONE undo step. ──
  const histRef = React.useRef({ undo: [], redo: [], committed: null, pending: null, timer: null, applying: false });
  const flushHistory = () => {
    const h = histRef.current;
    if (h.timer) { clearTimeout(h.timer); h.timer = null; h.undo.push(h.committed); if (h.undo.length > 60) h.undo.shift(); h.redo = []; h.committed = h.pending; }
  };
  useEffect(() => {
    const h = histRef.current;
    if (h.committed === null) { h.committed = data; return; }
    if (h.applying) { h.applying = false; h.committed = data; return; }
    h.pending = data;
    if (h.timer) clearTimeout(h.timer);
    h.timer = setTimeout(() => { h.undo.push(h.committed); if (h.undo.length > 60) h.undo.shift(); h.redo = []; h.committed = h.pending; h.timer = null; }, 450);
  }, [data]);
  const undo = () => { const h = histRef.current; flushHistory(); if (!h.undo.length) return; h.redo.push(h.committed); const prev = h.undo.pop(); h.committed = prev; h.applying = true; setData(prev); };
  const redo = () => { const h = histRef.current; if (!h.redo.length) return; h.undo.push(h.committed); const next = h.redo.pop(); h.committed = next; h.applying = true; setData(next); };
  useEffect(() => {
    const onKey = (e) => {
      const el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return; // let fields own Ctrl+Z
      const mod = e.ctrlKey || e.metaKey;
      if (mod && (e.key === "z" || e.key === "Z")) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      else if (mod && (e.key === "y" || e.key === "Y")) { e.preventDefault(); redo(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const fields = (spec && spec.fields) || [];
  // Added text boxes (data._extras) join the editable field list, so they show
  // up in the COPY tab + swap dropdown exactly like the template's own fields.
  const extraFields = (data._extras || []).map((e) => ({ key: e.key, label: e.label || "Added text", type: "text" }));
  // Render text fields as textareas so Enter inserts a line break; TplText shows
  // the \n (white-space: pre-line). Mirrors the static editor's newline support.
  const multiline = (f) => (f.type === "text" ? { ...f, type: "textarea" } : f);
  const copyFields = [...fields.filter((f) => f.type !== "image").map(multiline), ...extraFields.map(multiline)];
  const imageFields = fields.filter((f) => f.type === "image");
  const imageKey = imageFields.length ? imageFields[0].key : null;
  const Comp = spec && spec.component ? window[spec.component] : null;

  const pickPhoto = (it) => { setPhoto(it.path); setClip(null); if (imageKey) setField(imageKey, apiBase() + it.url); };
  const pickClip  = (it) => { setClip(it.path); setPhoto(null); if (imageKey) setField(imageKey, apiBase() + it.url); };
  const pickAudio = (it) => setAudio({ src: it.path, startAt: 0, volume: 1 });

  async function save(render) {
    setBusy(render ? "Rendering…" : "Saving…");
    const patch = isFresh
      ? { headline, microscript, notes }
      : { templateData: data, template,
          ...(photo ? { photo } : {}), ...(clip ? { clip } : {}), ...(audio ? { audio } : {}) };
    try {
      // B7: await the /plan patch before render (the runner reads the plan from
      // disk at start), so the render never picks up stale copy.
      const r = await fetch(`${apiBase()}/plan/${plan.campaign}/${angleId}/${assetId}`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch),
      });
      if (!r.ok) throw new Error(await r.text());
      if (render && !isFresh) {
        const rr = await fetch(`${apiBase()}/render-asset/${plan.campaign}/${angleId}/${assetId}`, { method: "POST" });
        const rj = await rr.json();
        if (rj.exitCode !== 0) throw new Error((rj.stderr || "render failed").slice(-200));
      }
      setBusy(null); bridge.reload();
      // On Render: keep the modal open and bust the preview cache so the user
      // sees the new output. Plain Save keeps the prior close behavior.
      if (render && !isFresh) setOutVer((n) => n + 1);
      else onClose();
    } catch (e) {
      setBusy(null);
      alert((render ? "Render" : "Save") + " failed: " + e.message);
    }
  }

  return (
    <div className="vmodal-bg on" onClick={onClose}>
      <div className="vmodal-card" onClick={(e) => e.stopPropagation()}>
        <div className="vmodal-head">
          <span className="vm-id">{assetId}</span>
          <span className="vm-title">{isFresh ? "Fresh creative — copy only" : ((asset.format || "video").toUpperCase() + " · " + template)}</span>
          {!isFresh && <button className="vm-hbtn" onClick={undo} title="Undo (Ctrl+Z)">↶</button>}
          {!isFresh && <button className="vm-hbtn" onClick={redo} title="Redo (Ctrl+Shift+Z)">↷</button>}
          <button className="x" onClick={onClose}>Close</button>
        </div>
        <div className="vmodal-body">
          <div className="vmodal-stage" ref={stageRef}>
            {(() => {
              if (isFresh) return <div className="vm-fresh">Fresh render pending<br/><span>(compose-creative not built yet)</span></div>;
              // Prefer the ALREADY-RENDERED output (robust) over the live Stage
              // remount; keep live Stage only for the position tab (drag handles
              // need it) + as last-resort fallback.
              const live = bridge.findAsset(angleId, assetId) || asset;
              const out = live && (live.output || live.thumb);
              const outUrl = out ? (apiBase() + (out.startsWith("/") ? out : "/" + out)) : null;
              const wantLive = tab === "position";
              if (!wantLive && outUrl) {
                // Bust on renderedAt (changes when the file changes, survives page
                // reloads) AND outVer (in-session re-render bump) so the browser's
                // media cache can never replay a stale/corrupt copy at the same URL.
                const ver = (live.renderedAt || live.editedAt || "0") + "." + outVer;
                const busted = outUrl + (outUrl.includes("?") ? "&" : "?") + "v=" + encodeURIComponent(ver);
                return /\.mp4(\?|$)/i.test(outUrl)
                  ? <video key={busted} src={busted} muted loop autoPlay playsInline style={{ width: "100%", height: "100%", objectFit: "contain" }} />
                  : <img key={busted} src={busted} alt="" style={{ width: "100%", height: "100%", objectFit: "contain" }} />;
              }
              if (Comp && window.Stage) {
                // Loop the template's intrinsic L-second animation to fill the
                // chosen clip length (L = SPEC duration default), so the live
                // preview matches the looped render (PROCESS.md "preview == render").
                const durField = (spec && spec.fields || []).find((f) => f.key === "duration");
                const loopLen = (durField && durField.default) || (Number(data.duration) || 8);
                const Loop = window.LoopRemap || ((p) => p.children);
                return (
                  <window.Stage key={template + ":" + (Number(data.duration) || 8)}
                      width={1080} height={1920} duration={Number(data.duration) || 8}
                      background="#0a0b0d" autoplay loop>
                    <Loop loopLength={loopLen}>
                      <Comp data={data} />
                      {window.ExtrasLayer && <window.ExtrasLayer data={data} />}
                    </Loop>
                  </window.Stage>
                );
              }
              return outUrl
                ? <div className="vm-fresh">Showing last render. Save + Re-render to update.</div>
                : <div className="vm-fresh">Loading preview…</div>;
            })()}
            {!isFresh && tab === "position" && Comp && window.Stage &&
              <DragOverlay stageRef={stageRef} data={data} setOverride={setOverride}
                selected={selected} setSelected={setSelected} />}
          </div>
          <div className="vmodal-side">
            {isFresh ? (
              <div className="vm-copy">
                <label>Headline<textarea value={headline} onChange={(e) => setHeadline(e.target.value)} rows={3} /></label>
                <label>Microscript<input value={microscript} onChange={(e) => setMicroscript(e.target.value)} /></label>
                <label>Notes<textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} /></label>
                <div className="vm-note">Fresh assets render once compose-creative ships. Copy is saved to the plan now.</div>
              </div>
            ) : (
              <React.Fragment>
                <div className="vm-tabs">
                  {["copy", "media", "audio", "swap", "position"].map((t) =>
                    <button key={t} className={"vm-tab" + (tab === t ? " on" : "")} onClick={() => setTab(t)}>{t}</button>)}
                </div>
                {/* Kraken bar stays mounted across media+audio (preserves the
                    folder selection); hidden on the other tabs. */}
                <div style={{ display: (tab === "media" || tab === "audio") ? "block" : "none" }}>
                  <KrakenBar campaign={plan.campaign} onChanged={() => setMediaReload((n) => n + 1)}
                    onUploaded={(items) => {
                      const it = items[items.length - 1];
                      if (!it) return;
                      // Route by kind. pickPhoto/pickClip set the clip/photo STATE
                      // (→ asset.clip on save) AND data[imageKey] for the preview.
                      if (it.kind === "audio") pickAudio(it);
                      else if (imageKey) { it.kind === "clip" ? pickClip(it) : pickPhoto(it); }
                      // No imageKey → the template has no media slot; the media-tab
                      // hint already explains it; nothing to place.
                    }}
                    onPlaced={(file) => {
                      // A per-file Kraken pull: place it by type via the same path.
                      if (!file || !file.path || !imageKey) return;
                      const it = { path: file.path, url: "/media-file/" + file.path, name: file.name };
                      file.type === "video" ? pickClip(it) : pickPhoto(it);
                    }} />
                </div>
                <div className="vm-tabbody">
                  {tab === "copy" && (window.EditPanel
                    ? <React.Fragment>
                        <CampaignSwap fields={copyFields} setField={setField} campaign={plan.campaign} />
                        <window.EditPanel spec={{ id: template, name: template, fields: copyFields }}
                          data={data} setField={setField} setFields={setFields} reset={reset}
                          templateDuration={Number(data.duration) || 8} />
                      </React.Fragment>
                    : <div className="vm-hint">Loading editor…</div>)}
                  {tab === "media" && (imageKey
                    ? <React.Fragment>
                        <div className="vm-sub">Photo</div><MediaPicker kind="photo" current={photo} onPick={pickPhoto} campaign={plan.campaign} reloadKey={mediaReload} />
                        <div className="vm-sub">Clip</div><MediaPicker kind="clip" current={clip} onPick={pickClip} campaign={plan.campaign} reloadKey={mediaReload} />
                        {window.MediaField && window.isVideoSrc && window.isVideoSrc(data[imageKey]) &&
                          <React.Fragment>
                            <div className="vm-sub">Trim clip — crop front/back</div>
                            <window.MediaField field={{ key: imageKey, label: "Background clip", type: "image" }}
                              data={data} setFields={setFields} templateDuration={Number(data.duration) || 8} />
                            <div className="vm-note">Drag the handles to cut the start/end of the clip; the render uses only the trimmed window.</div>
                          </React.Fragment>}
                      </React.Fragment>
                    : <div className="vm-hint">This template has no photo/clip slot.</div>)}
                  {tab === "audio" && <React.Fragment>
                    <MediaPicker kind="audio" current={audio && audio.src} onPick={pickAudio} campaign={plan.campaign} reloadKey={mediaReload} />
                    <div className="vm-note">Upload audio above to use it here. The Kraken pull brings in images/clips only, and the render is silent for now (mux deferred).</div>
                  </React.Fragment>}
                  {tab === "swap" && <React.Fragment>
                    <div className="vm-sub">Swap template</div>
                    <select className="tp-input tp-select" value={template || ""} onChange={(e) => setTemplate(e.target.value)}>
                      {bank.map((t) => <option key={t} value={t}>{t}</option>)}
                    </select>
                    <div className="vm-note">Switching carries copy by matching field name; re-check fields after a swap.</div>
                  </React.Fragment>}
                  {tab === "position" && <React.Fragment>
                    <div className="vm-sub">Move &amp; resize text{selected.length ? ` · ${selected.length} selected` : ""}</div>
                    <div className="vm-hint">Click a highlighted element to select; <b>shift-click</b> to add more and move them together. <b>Drag</b> to move. <b>Scroll-wheel</b>, the <b>± buttons</b>, or <b>+/−</b> keys resize the selection (a hand-set size wins — text grows past its box if you push it; auto-fit only pre-sizes text you haven't touched). Edit any text in the <b>COPY</b> tab.</div>
                    <button className="vm-tab" style={{ marginTop: 8 }} onClick={addText}>+ Add text</button>
                    {(data._extras || []).length > 0 && <React.Fragment>
                      <div className="vm-sub">Added text boxes</div>
                      {(data._extras || []).map((e) => (
                        <div key={e.key} className="vm-swap-row">
                          <span>{(data[e.key] || e.label || "").slice(0, 22)}</span>
                          <button className="vm-tab" onClick={() => removeExtra(e.key)}>✕ remove</button>
                        </div>
                      ))}
                    </React.Fragment>}
                    <button className="vm-tab" style={{ marginTop: 10 }} onClick={() => { resetOverrides(); setSelected([]); }}>Reset all positions &amp; sizes</button>
                  </React.Fragment>}
                </div>
              </React.Fragment>
            )}
            <div className="vmodal-actions">
              <button className="vm-save" disabled={!!busy} onClick={() => save(false)}>{busy || "Save"}</button>
              {!isFresh && <button className="vm-render" disabled={!!busy} onClick={() => save(true)}>{busy || "Save + Re-render"}</button>}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

const _vmRoot = ReactDOM.createRoot(document.getElementById("videoModalRoot"));
function renderVideoModal(props) {
  _vmRoot.render(props ? <VideoEditModal {...props} onClose={() => renderVideoModal(null)} /> : null);
}
// Called by the vanilla card "Edit" handler for video/gif/fresh assets.
window.openVideoEditor = (angleId, assetId) => renderVideoModal({ angleId, assetId });
</script>
</body>
</html>
