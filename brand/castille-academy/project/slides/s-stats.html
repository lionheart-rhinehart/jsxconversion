<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_slide.css"></head>
<body>
<div class="slide" data-screen-label="Slide · Stats">
  <div style="position:absolute;inset:0;padding:80px 80px;display:flex;flex-direction:column;justify-content:center">
    <div style="display:flex;align-items:baseline;gap:18px;margin-bottom:48px">
      <div class="eyebrow">Real Results</div>
      <span style="flex:1;height:1px;background:var(--ca-paper-300)"></span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr)">
      <div style="padding-right:48px">
        <div class="data" style="font-size:120px;color:var(--ca-ink-900);line-height:0.86">+12<span style="font-size:48px;color:var(--ca-red-600)"> pts</span></div>
        <div class="label" style="font-size:18px;color:var(--ca-ink-500);margin-top:14px">Avg. Index gain / season</div>
      </div>
      <div style="padding:0 48px;border-left:1px solid var(--ca-paper-300)">
        <div class="data" style="font-size:120px;color:var(--ca-ink-900);line-height:0.86">1,400<span style="font-size:48px;color:var(--ca-red-600)">+</span></div>
        <div class="label" style="font-size:18px;color:var(--ca-ink-500);margin-top:14px">Athletes developed</div>
      </div>
      <div style="padding:0 48px;border-left:1px solid var(--ca-paper-300)">
        <div class="data" style="font-size:120px;color:var(--ca-ink-900);line-height:0.86">4</div>
        <div class="label" style="font-size:18px;color:var(--ca-ink-500);margin-top:14px">Indiana campuses</div>
      </div>
    </div>
    <p class="serif" style="font-size:22px;color:var(--ca-ink-600);margin:54px 0 0;max-width:760px">Measured at intake, re-scored every block. The number moves because the work is real.</p>
  </div>
</div>
</body></html>
