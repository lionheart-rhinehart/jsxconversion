<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .stats{display:grid;grid-template-columns:repeat(3,1fr)}
  .stat{padding:0 20px;border-left:1px solid var(--ca-ink-200)}
  .stat:first-child{padding-left:0;border-left:0}
  .stat b{display:block;font-family:var(--font-cond);font-weight:800;font-size:52px;line-height:0.9;color:var(--ca-ink-900);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
  .stat b .u{font-size:24px;color:var(--ca-red-600)}
  .stat span{font-family:var(--font-cond);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-3)}
</style></head>
<body><div class="card">
  <span class="cap" style="display:block;margin-bottom:18px">Stat block · condensed tabular trio</span>
  <div class="stats">
    <div class="stat"><b>+12<span class="u"> pts</span></b><span>Avg. Index gain / season</span></div>
    <div class="stat"><b>1,400<span class="u">+</span></b><span>Athletes developed</span></div>
    <div class="stat"><b>4</b><span>Indiana campuses</span></div>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--fg-3);margin:18px 0 0">Always a trio, divided by hairline rules. Numerals in Saira Condensed 800, units in brass. Tabular figures keep columns aligned.</p>
</div></body></html>
