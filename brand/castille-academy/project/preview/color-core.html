<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="spread" style="margin-bottom:18px">
    <span class="cap">Core palette · Black · White · Red</span>
    <span class="cap" style="color:var(--ca-red-600)">brand defining</span>
  </div>
  <div class="row" style="gap:30px;justify-content:center;padding:4px 0 6px">
    <div class="col" style="align-items:center;gap:11px"><div style="width:96px;height:96px;border-radius:50%;background:#000000"></div><span class="chip" style="font-size:13px">#000000</span></div>
    <div class="col" style="align-items:center;gap:11px"><div style="width:96px;height:96px;border-radius:50%;background:#ffffff;box-shadow:inset 0 0 0 1px var(--ca-ink-200)"></div><span class="chip" style="font-size:13px">#FFFFFF</span></div>
    <div class="col" style="align-items:center;gap:11px"><div style="width:96px;height:96px;border-radius:50%;background:#a81918"></div><span class="chip" style="font-size:13px;color:var(--ca-red-700)">#A81918</span></div>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--fg-3);margin:14px 0 0;text-align:center">The whole system runs on three colors. Black grounds, white canvas, and a single disciplined red (<b style="color:var(--ca-red-700)">#A81918</b>) for accents, CTAs and the Index. Everything else is a neutral derived from black.</p>
</div></body></html>
