<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(0,0,0,0.92);border-radius:var(--r-lg)}
  .mark{display:flex;align-items:center;gap:11px}
  .crest{width:34px;height:38px;border:1.5px solid var(--ca-red-400);border-radius:4px 4px 16px 16px/4px 4px 20px 20px;display:flex;align-items:center;justify-content:center;color:var(--ca-red-300);font-family:var(--font-display);font-size:19px;line-height:1}
  .wm{display:flex;flex-direction:column;gap:1px}
  .wm b{font-family:var(--font-display);font-size:19px;letter-spacing:0.02em;color:var(--ca-paper-100);line-height:1}
  .wm span{font-family:var(--font-cond);font-weight:600;font-size:9.5px;letter-spacing:0.42em;color:var(--ca-red-300);text-transform:uppercase}
  .links{display:flex;gap:26px}
  .links a{font-family:var(--font-cond);font-weight:600;font-size:14px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ca-ink-200);text-decoration:none}
  .links a.on{color:var(--ca-red-300)}
  .cta{font-family:var(--font-cond);font-weight:600;font-size:14px;letter-spacing:0.09em;text-transform:uppercase;background:var(--ca-red-500);color:var(--ca-ink-950);padding:10px 16px;border-radius:var(--r-md)}
</style></head>
<body><div class="card card--bone" style="padding:18px">
  <span class="cap" style="display:block;margin-bottom:12px">Header / nav · scrolled (frosted navy)</span>
  <div class="nav">
    <div class="mark">
      <div class="crest">C</div>
      <div class="wm"><b>Castille</b><span>Academy</span></div>
    </div>
    <div class="links"><a class="on">Programs</a><a>Method</a><a>Campuses</a><a>Results</a></div>
    <span class="cta">Book Assessment</span>
  </div>
</div></body></html>
