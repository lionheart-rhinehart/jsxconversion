<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="spread" style="margin-bottom:20px"><span class="cap">Elevation · soft, warm-shadowed</span><span class="cap" style="color:var(--ca-red-600)">--shadow-*</span></div>
  <div class="row" style="gap:20px;flex-wrap:wrap;align-items:flex-end">
    <div class="col" style="gap:10px;align-items:center"><div style="width:84px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-1)"></div><span class="cap">1</span></div>
    <div class="col" style="gap:10px;align-items:center"><div style="width:84px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-2)"></div><span class="cap">2 ·card</span></div>
    <div class="col" style="gap:10px;align-items:center"><div style="width:84px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-3)"></div><span class="cap">3 ·hover</span></div>
    <div class="col" style="gap:10px;align-items:center"><div style="width:84px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-4)"></div><span class="cap">4 ·modal</span></div>
    <div class="col" style="gap:10px;align-items:center"><div style="width:84px;height:56px;background:var(--ca-red-500);border-radius:8px;box-shadow:var(--shadow-red)"></div><span class="cap">brass ·CTA</span></div>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--fg-3);margin:18px 0 0">Cards rest on <b style="color:var(--fg-2)">shadow-2</b>, lift to <b style="color:var(--fg-2)">shadow-3</b> on hover. The brass glow is reserved for the primary CTA on hover only.</p>
</div></body></html>
