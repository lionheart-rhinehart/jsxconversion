<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="spread" style="margin-bottom:16px">
    <span class="cap">Semantic status · functional only</span>
    <span class="cap" style="color:var(--ca-red-600)">muted, sparing</span>
  </div>
  <div class="row" style="gap:10px;flex-wrap:wrap">
    <div class="col" style="gap:6px;align-items:center"><div style="width:124px;height:44px;border-radius:var(--r-md);background:#2f7d54"></div><span class="chip">Success</span></div>
    <div class="col" style="gap:6px;align-items:center"><div style="width:124px;height:44px;border-radius:var(--r-md);background:#c08a1e"></div><span class="chip">Warning</span></div>
    <div class="col" style="gap:6px;align-items:center"><div style="width:124px;height:44px;border-radius:var(--r-md);background:#a81918"></div><span class="chip">Danger</span></div>
    <div class="col" style="gap:6px;align-items:center"><div style="width:124px;height:44px;border-radius:var(--r-md);background:#3a5a86"></div><span class="chip">Info</span></div>
    <div class="col" style="gap:6px;align-items:center"><div style="width:124px;height:44px;border-radius:var(--r-md);background:#2c5e43"></div><span class="chip">Pitch (turf)</span></div>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--fg-3);margin:16px 0 0">Status colors stay muted so they never compete with brand red. <b style="color:var(--fg-2)">Danger reuses the brand red</b>; pitch green appears only in true sport/turf context.</p>
</div></body></html>
