<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="spread" style="margin-bottom:14px">
    <span class="cap">Red scale · the single accent</span>
    <span class="cap" style="color:var(--ca-red-600)">--ca-red-*</span>
  </div>
  <div class="swatches" style="border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-2)">
    <div class="sw" style="background:#fadbd8"><small style="color:#4d0c0b">100<span class="hex">#FADBD8</span></small></div>
    <div class="sw" style="background:#f1b2ad"><small style="color:#4d0c0b">200<span class="hex">#F1B2AD</span></small></div>
    <div class="sw" style="background:#d2514a"><small style="color:#fff">400<span class="hex" style="color:#fadbd8">#D2514A</span></small></div>
    <div class="sw" style="background:#c01f1c"><small style="color:#fff">500<span class="hex" style="color:#fadbd8">#C01F1C</span></small></div>
    <div class="sw" style="background:#a81918"><small style="color:#fff">600<span class="hex" style="color:#fadbd8">#A81918</span></small></div>
    <div class="sw" style="background:#891513"><small style="color:#fff">700<span class="hex" style="color:#fadbd8">#891513</span></small></div>
    <div class="sw" style="background:#4d0c0b"><small style="color:#fff">900<span class="hex" style="color:#f1b2ad">#4D0C0B</span></small></div>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--fg-3);margin:12px 0 0"><b style="color:var(--ca-red-700)">600 (#A81918)</b> is the brand red — buttons, accent words, active states, the Index ring. <b style="color:var(--ca-red-700)">700</b> for red text on white and press states. Used surgically, never as a body-text background.</p>
</div></body></html>
