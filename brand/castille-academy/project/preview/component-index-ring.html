<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .ring{position:relative;width:118px;height:118px;border-radius:50%;
    background:conic-gradient(var(--ca-red-500) 0 74%, var(--ca-ink-800) 74% 100%);
    display:flex;align-items:center;justify-content:center}
  .ring::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--ca-ink-900)}
  .ring .val{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1}
  .ring .val b{font-family:var(--font-cond);font-weight:800;font-size:46px;color:var(--ca-paper-100);font-variant-numeric:tabular-nums}
  .ring .val span{font-family:var(--font-cond);font-weight:600;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ca-red-300);margin-top:2px}
  .meter{display:flex;flex-direction:column;gap:9px;flex:1}
  .meter .r{display:flex;flex-direction:column;gap:5px}
  .meter .lab{display:flex;justify-content:space-between;font-family:var(--font-cond);font-weight:600;font-size:12px;letter-spacing:0.08em;text-transform:uppercase}
  .meter .lab span:first-child{color:var(--ca-ink-200)}
  .meter .lab span:last-child{color:var(--ca-red-300);font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:999px;background:var(--ca-ink-700)}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--ca-red-400)}
</style></head>
<body><div class="card card--navy">
  <div class="spread" style="margin-bottom:16px"><span class="cap" style="color:var(--ca-red-300)">The Castille Index · signature metric</span><span class="cap" style="color:var(--ca-ink-300)">0–100</span></div>
  <div class="row" style="gap:22px">
    <div class="ring"><div class="val"><b>74</b><span>Index</span></div></div>
    <div class="meter">
      <div class="r"><div class="lab"><span>Velocity</span><span>71</span></div><div class="bar"><i style="width:71%"></i></div></div>
      <div class="r"><div class="lab"><span>Force</span><span>78</span></div><div class="bar"><i style="width:78%"></i></div></div>
      <div class="r"><div class="lab"><span>Craft</span><span>73</span></div><div class="bar"><i style="width:73%"></i></div></div>
    </div>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--ca-ink-200);margin:14px 0 0">A composite of speed, power and skill, measured at intake and re-scored every block. The ring + three-bar breakdown is the brand's central data device — it recurs on the site, dashboard and app.</p>
</div></body></html>
