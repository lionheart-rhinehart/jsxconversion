<!-- @dsCard group="Brand" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ca-photo{height:96px;border-radius:var(--r-md)}
  .raw{height:96px;border-radius:var(--r-md);overflow:hidden}
  .raw img{width:100%;height:100%;object-fit:cover}
  .tg{position:absolute;left:8px;bottom:7px;z-index:2;font-family:var(--font-cond);font-weight:600;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ca-paper-100)}
</style></head>
<body><div class="card">
  <div class="spread" style="margin-bottom:14px"><span class="cap">Photography · navy duotone treatment</span><span class="cap" style="color:var(--ca-red-600)">.ca-photo</span></div>
  <div class="g">
    <div class="raw"><img src="../assets/photo-sprint-mixed.jpg" alt=""></div>
    <div class="ca-photo"><img src="../assets/photo-sprint-mixed.jpg" alt=""><span class="tg">Treated</span></div>
    <div class="ca-photo"><img src="../assets/photo-box-jump.jpg" alt=""></div>
    <div class="ca-photo"><img src="../assets/photo-medball.jpg" alt=""></div>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--fg-3);margin:13px 0 0"><b style="color:var(--fg-2)">Left = raw, second = treated.</b> Desaturate ~22%, cool navy multiply wash, brass-warmed highlights, and a bottom protection gradient that also covers legacy watermarks. Hard top-down gym light reads premium once graded.</p>
</div></body></html>
