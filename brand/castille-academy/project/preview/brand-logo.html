<!-- @dsCard group="Brand" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .lk{display:flex;align-items:center;gap:14px}
  .crest{width:50px;height:56px;border:1.75px solid var(--ca-red-500);border-radius:5px 5px 22px 22px/5px 5px 26px 26px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:28px;line-height:1;color:var(--ca-red-600)}
  .wm{display:flex;flex-direction:column;gap:3px}
  .wm b{font-family:var(--font-display);font-size:30px;letter-spacing:0.01em;line-height:0.9}
  .wm .rule{height:1px;background:var(--ca-red-500)}
  .wm span{font-family:var(--font-cond);font-weight:600;font-size:11px;letter-spacing:0.46em;text-transform:uppercase;color:var(--ca-red-600)}
  .on-navy .crest{border-color:var(--ca-red-400);color:var(--ca-red-300)}
  .on-navy .wm b{color:var(--ca-paper-100)}
  .on-navy .wm span{color:var(--ca-red-300)}
  .on-navy .wm .rule{background:var(--ca-red-400)}
</style></head>
<body><div class="card" style="padding:0">
  <div style="padding:20px 24px;background:var(--ca-paper-100)">
    <span class="cap" style="display:block;margin-bottom:16px">Wordmark + monogram crest · primary lockup</span>
    <div class="lk"><div class="crest">C</div><div class="wm"><b style="color:var(--ca-ink-900)">Castille</b><div class="rule"></div><span>Academy</span></div></div>
  </div>
  <div class="on-navy" style="padding:20px 24px;background:var(--ca-ink-900);display:flex;align-items:center;gap:34px">
    <div class="lk"><div class="crest">C</div><div class="wm"><b>Castille</b><div class="rule"></div><span>Academy</span></div></div>
    <span style="font-family:var(--font-body);font-size:12px;color:var(--ca-ink-300);max-width:210px;line-height:1.5">Reverses to bone + brass on navy. Use ≥ 30px cap height; below that, crest-only.</span>
  </div>
</div></body></html>
