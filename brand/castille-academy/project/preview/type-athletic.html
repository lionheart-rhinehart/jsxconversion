<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="spread" style="margin-bottom:14px">
    <span class="cap">Athletic · Saira Condensed</span>
    <span class="cap" style="color:var(--ca-red-600)">labels · stats · nav</span>

    <div class="col"><span style="font-family:var(--font-cond);font-weight:800;font-size:56px;line-height:0.85;color:var(--ca-ink-900);font-variant-numeric:tabular-nums">74</span><span style="font-family:var(--font-cond);font-weight:600;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3)">Castille Index</span></div>

    <div class="col"><span style="font-family:var(--font-cond);font-weight:800;font-size:56px;line-height:0.85;color:var(--ca-red-600);font-variant-numeric:tabular-nums">+4<span style="font-size:24px">″</span></span><span style="font-family:var(--font-cond);font-weight:600;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3)">Vertical</span></div>
  </div>
  <div class="row" style="gap:8px;margin-top:16px">
    <span class="ca-label" style="font-size:14px;color:var(--ca-ink-700)">Velocity</span><span style="color:var(--ca-red-400)">·</span>
    <span class="ca-label" style="font-size:14px;color:var(--ca-ink-700)">Force</span><span style="color:var(--ca-red-400)">·</span>
    <span class="ca-label" style="font-size:14px;color:var(--ca-ink-700)">Craft</span>
  </div>
</div></body></html>
