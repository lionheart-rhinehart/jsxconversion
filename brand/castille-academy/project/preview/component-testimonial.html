<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .quote{font-family:var(--font-serif);font-style:italic;font-size:20px;line-height:1.45;color:var(--ca-ink-900);margin:0}
  .stars{display:flex;gap:3px;color:var(--ca-red-500);margin-bottom:12px}
  .stars i{width:16px;height:16px;fill:currentColor}
  .who{display:flex;align-items:center;gap:11px;margin-top:16px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--ca-ink-900);color:var(--ca-red-300);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px}
  .who b{font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--ca-ink-900);display:block;line-height:1.3}
  .who span{font-family:var(--font-cond);font-weight:600;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-3)}
</style></head>
<body><div class="card card--bone">
  <span class="cap" style="display:block;margin-bottom:12px">Testimonial</span>
  <div class="stars"><i data-lucide="star"></i><i data-lucide="star"></i><i data-lucide="star"></i><i data-lucide="star"></i><i data-lucide="star"></i></div>
  <p class="quote">"Her Index went from 61 to 79 in two blocks. But the bigger change is the confidence — she walks onto the pitch like she belongs."</p>
  <div class="who"><div class="av">J</div><div><b>Julie H.</b><span>Parent · Soccer · Carmel</span></div></div>
</div>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
