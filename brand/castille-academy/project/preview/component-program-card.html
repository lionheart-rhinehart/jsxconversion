<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pcard{background:var(--ca-white);border:1px solid var(--ca-ink-200);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-2);transition:box-shadow var(--dur-base) var(--ease-out)}
  .pcard:hover{box-shadow:var(--shadow-3)}
  .ca-photo{height:108px}
  .pmeta{padding:13px 15px 15px}
  .ptier{font-family:var(--font-cond);font-weight:600;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ca-red-600)}
  .pcard h5{font-family:var(--font-display);font-size:21px;color:var(--ca-ink-900);margin:3px 0 7px;line-height:1.05}
  .prow{display:flex;align-items:center;gap:7px;font-family:var(--font-body);font-size:12.5px;color:var(--fg-3)}
  .prow i{width:14px;height:14px;color:var(--ca-ink-400)}
  .photo-label{position:absolute;left:13px;bottom:11px;z-index:2;white-space:nowrap;font-family:var(--font-cond);font-weight:700;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ca-paper-100)}
</style></head>
<body><div class="card card--bone">
  <span class="cap" style="display:block;margin-bottom:14px">Program cards · photo + age tier</span>
  <div class="pgrid">
    <div class="pcard">
      <div class="ca-photo"><img src="../assets/photo-agility-female.jpg" alt=""><span class="photo-label">Ages 12–15</span></div>
      <div class="pmeta"><span class="ptier">Rise · Development</span><h5>Multi-Sport Rise</h5>
        <div class="prow"><i data-lucide="calendar"></i>2× / week · 10-week block</div>
        <div class="prow" style="margin-top:4px"><i data-lucide="users"></i>Small group · 6:1 ratio</div>
      </div>
    </div>
    <div class="pcard">
      <div class="ca-photo"><img src="../assets/photo-lifting.jpg" alt=""><span class="photo-label">Ages 16–18</span></div>
      <div class="pmeta"><span class="ptier">Varsity · Performance</span><h5>Varsity Force</h5>
        <div class="prow"><i data-lucide="calendar"></i>3× / week · 12-week block</div>
        <div class="prow" style="margin-top:4px"><i data-lucide="trending-up"></i>Index review every 4 weeks</div>
      </div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
