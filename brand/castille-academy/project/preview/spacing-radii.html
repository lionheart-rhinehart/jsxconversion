<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card card--bone">
  <div class="spread" style="margin-bottom:16px"><span class="cap">Corner radii · squared-to-gentle</span><span class="cap" style="color:var(--ca-red-600)">--r-*</span></div>
  <div class="row" style="gap:16px;flex-wrap:wrap;align-items:flex-end">
    <div class="col" style="gap:8px;align-items:center"><div style="width:72px;height:56px;background:var(--ca-white);border:1px solid var(--ca-ink-200);border-radius:0"></div><span class="cap">none · 0</span></div>
    <div class="col" style="gap:8px;align-items:center"><div style="width:72px;height:56px;background:var(--ca-white);border:1px solid var(--ca-ink-200);border-radius:2px"></div><span class="cap">sm · 2</span></div>
    <div class="col" style="gap:8px;align-items:center"><div style="width:72px;height:56px;background:var(--ca-white);border:1px solid var(--ca-ink-200);border-radius:4px"></div><span class="cap">md · 4 ·btn</span></div>
    <div class="col" style="gap:8px;align-items:center"><div style="width:72px;height:56px;background:var(--ca-white);border:1px solid var(--ca-ink-200);border-radius:8px"></div><span class="cap">lg · 8 ·card</span></div>
    <div class="col" style="gap:8px;align-items:center"><div style="width:72px;height:56px;background:var(--ca-white);border:1px solid var(--ca-ink-200);border-radius:12px"></div><span class="cap">xl · 12</span></div>
    <div class="col" style="gap:8px;align-items:center"><div style="width:72px;height:34px;background:var(--ca-white);border:1px solid var(--ca-ink-200);border-radius:999px"></div><span class="cap">pill · chips</span></div>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--fg-3);margin:14px 0 0">Buttons squared at <b style="color:var(--fg-2)">4px</b>, cards gentle at <b style="color:var(--fg-2)">8px</b>. Never stack a 24px+ radius — Castille is heritage, not a friendly app.</p>
</div></body></html>
