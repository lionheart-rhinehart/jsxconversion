<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .hero{position:relative;height:300px;border-radius:var(--r-lg);overflow:hidden;background:var(--ca-ink-900)}
  .hero>img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08) brightness(0.8)}
  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0.15) 40%,rgba(0,0,0,0.85) 100%);mix-blend-mode:multiply}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.55) 0%,transparent 55%)}
  .inner{position:absolute;inset:0;z-index:2;padding:30px 34px;display:flex;flex-direction:column;justify-content:flex-end}
  .eb{font-family:var(--font-cond);font-weight:600;font-size:13px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ca-red-300);margin-bottom:12px}
  .ht{font-family:var(--font-display);font-size:48px;line-height:0.98;color:var(--ca-paper-100);margin:0;letter-spacing:-0.01em}
  .ht .a{color:var(--ca-red-400)}
  .hs{font-family:var(--font-serif);font-size:16px;color:var(--ca-ink-200);margin:12px 0 0;max-width:430px}
</style></head>
<body><div class="card" style="padding:0">
  <div class="hero"><img src="../assets/hero-sprint-female.jpg" alt="">
    <div class="inner">
      <span class="eb">The Castille Method</span>
      <h2 class="ht">The Making<br>of an <span class="a">Athlete.</span></h2>
      <p class="hs">Assessed, measured, developed. A curriculum for speed, strength and craft — and a number that proves it.</p>
    </div>
  </div>
</div></body></html>
