<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .track { position:relative; height:8px; border-radius:999px; background:var(--ca-ink-100); overflow:hidden; }
  .fill { position:absolute; inset:0 auto 0 0; width:30%; border-radius:999px; background:var(--ca-red-500); animation:run 2.6s infinite; }
  .e1 .fill { animation-timing-function: cubic-bezier(0.22,0.61,0.36,1); }
  .e2 .fill { animation-timing-function: cubic-bezier(0.65,0.05,0.36,1); }
  @keyframes run { 0%{left:0%} 45%{left:70%} 55%{left:70%} 100%{left:0%} }
</style></head>
<body><div class="card card--navy">
  <div class="spread" style="margin-bottom:18px"><span class="cap" style="color:var(--ca-red-300)">Motion · refined, no bounce</span><span class="cap" style="color:var(--ca-ink-300)">160 / 280 / 520ms</span></div>
  <div class="col" style="gap:16px">
    <div class="col e1" style="gap:7px"><div class="track"><div class="fill"></div></div><span class="cap" style="color:var(--ca-ink-200)">ease-out · entrances · cubic-bezier(.22,.61,.36,1)</span></div>
    <div class="col e2" style="gap:7px"><div class="track"><div class="fill"></div></div><span class="cap" style="color:var(--ca-ink-200)">ease-inout · state changes · cubic-bezier(.65,.05,.36,1)</span></div>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--ca-ink-200);margin:16px 0 0">Fades and gentle 16px rises. Athletes are composed — <b style="color:#fff">no overshoot, no spring</b>. Headlines stagger up word-by-word at ~40ms.</p>
</div></body></html>
