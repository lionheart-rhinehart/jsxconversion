<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="spread" style="margin-bottom:14px"><span class="cap">Spacing scale · 8pt, tight low-end</span><span class="cap" style="color:var(--ca-red-600)">--s-1 … --s-10</span></div>
  <div class="col" style="gap:9px">
    <div class="row" style="gap:12px"><div style="width:4px;height:18px;background:var(--ca-red-500)"></div><span class="cap" style="width:64px">s-1 · 4</span><div style="width:8px;height:18px;background:var(--ca-red-500)"></div><span class="cap" style="width:64px">s-2 · 8</span><div style="width:12px;height:18px;background:var(--ca-red-500)"></div><span class="cap">s-3 · 12</span></div>
    <div class="row" style="gap:12px"><div style="width:16px;height:18px;background:var(--ca-ink-700)"></div><span class="cap" style="width:64px">s-4 · 16</span><div style="width:24px;height:18px;background:var(--ca-ink-700)"></div><span class="cap" style="width:64px">s-5 · 24</span><div style="width:32px;height:18px;background:var(--ca-ink-700)"></div><span class="cap">s-6 · 32</span></div>
    <div class="row" style="gap:12px"><div style="width:48px;height:18px;background:var(--ca-ink-400)"></div><span class="cap" style="width:64px">s-7 · 48</span><div style="width:64px;height:18px;background:var(--ca-ink-400)"></div><span class="cap" style="width:64px">s-8 · 64</span></div>
    <div class="row" style="gap:12px"><div style="width:96px;height:18px;background:var(--ca-ink-200)"></div><span class="cap" style="width:64px">s-9 · 96</span><div style="width:128px;height:18px;background:var(--ca-ink-200)"></div><span class="cap">s-10 · 128</span></div>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--fg-3);margin:12px 0 0"><b style="color:var(--fg-2)">s-9 (96)</b> between major sections, <b style="color:var(--fg-2)">s-7 (48)</b> between blocks. Sections breathe.</p>
</div></body></html>
