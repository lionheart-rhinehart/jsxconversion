<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--paper-soft);color:var(--fg1)}
.lbl{font-size:11px;color:var(--fg3);font-family:ui-monospace,monospace}

.card{background:#fff;border-radius:14px;box-shadow:var(--shadow-sm);padding:18px;width:300px}
.stars{color:var(--star);font-size:18px;letter-spacing:2px}

</style></head><body>
<div class="card">
  <div class="stars">★★★★★</div>
  <div style="font-size:15px;line-height:1.55;color:var(--fg1);margin:8px 0 12px;font-weight:500">"My daughter is faster, more confident, and finally getting real playing time."</div>
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:34px;height:34px;border-radius:50%;background:var(--smaa-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">SM</div>
    <div style="font-size:13px"><div style="font-weight:700">Sarah M.</div><div style="color:var(--fg3)">Soccer Parent · Portland</div></div>
  </div>
</div>
<div class="lbl" style="margin-top:12px">Testimonial card · gold stars · avatar</div></body></html>
