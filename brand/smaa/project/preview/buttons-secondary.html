<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:var(--font-sans);background:#fff;color:var(--fg1)}
.lbl{font-size:11px;color:var(--fg3);font-family:ui-monospace,monospace}

.btn{font-family:var(--font-sans);font-weight:700;font-size:15px;border-radius:10px;padding:15px 26px;cursor:pointer;text-transform:uppercase;letter-spacing:.02em}

</style></head><body>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
  <button class="btn" style="background:var(--smaa-green);color:#fff;border:none;box-shadow:var(--shadow-sm)">Access Free Tool</button>
  <button class="btn" style="background:#fff;color:var(--smaa-blue);border:2px solid var(--smaa-blue)">Learn More</button>
  <button class="btn" style="background:transparent;color:var(--fg2);border:2px solid var(--paper-line)">Ghost</button>
</div>
<div class="lbl" style="margin-top:12px">Green action · outline blue · ghost</div></body></html>
