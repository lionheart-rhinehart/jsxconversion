<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:var(--font-sans);background:#fff;color:var(--fg1)}
.lbl{font-size:11px;color:var(--fg3);font-family:ui-monospace,monospace}

.btn{font-family:var(--font-sans);font-weight:700;font-size:15px;border:none;border-radius:10px;padding:15px 26px;cursor:pointer;text-transform:uppercase;letter-spacing:.02em}

</style></head><body>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
  <button class="btn" style="background:var(--smaa-blue);color:#fff;box-shadow:var(--shadow-cta)">Get Started</button>
  <button class="btn" style="background:var(--smaa-blue-600);color:#fff;box-shadow:var(--shadow-cta)">Hover</button>
  <button class="btn" style="background:var(--smaa-blue-600);color:#fff;transform:scale(.97)">Pressed</button>
</div>
<div class="lbl" style="margin-top:12px">Primary CTA · blue · uppercase 700 · blue glow · darken+lift on hover</div></body></html>
