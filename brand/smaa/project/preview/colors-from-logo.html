<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;font-family:var(--font-sans);background:#fff;color:var(--fg1)}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column;gap:6px}
.sw{height:84px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.meta{font-size:12px;color:var(--fg3);font-family:var(--font-sans)}
.name{font-size:13px;font-weight:700;color:var(--fg1)}
.hex{font-family:ui-monospace,monospace;font-size:12px;color:var(--fg2)}

</style></head><body>
<div class="meta" style="margin-bottom:10px">Palette sampled from the logo (smaa.webp). Blue + green + white are the working core; maroon/pink are render artifacts.</div>
<div class="row">
  <div class="col" style="flex:1"><div class="sw" style="background:#ffffff;border:1px solid var(--paper-line);color:var(--fg2)">White</div><div class="hex">#ffffff</div></div>
  <div class="col" style="flex:1"><div class="sw" style="background:#017ee6">Blue</div><div class="hex">#017ee6</div></div>
  <div class="col" style="flex:1"><div class="sw" style="background:#59be0b">Green</div><div class="hex">#59be0b</div></div>
  <div class="col" style="flex:1"><div class="sw" style="background:linear-gradient(135deg,#320303,#d19eb9)">Artifact</div><div class="hex">#320303→#d19eb9</div></div>
</div></body></html>
