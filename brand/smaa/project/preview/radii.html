<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:var(--font-sans);background:#fff;color:var(--fg1)}
.lbl{font-size:11px;color:var(--fg3);font-family:ui-monospace,monospace}

</style></head><body>
<div style="display:flex;gap:18px;align-items:flex-end">
  
  <div style="text-align:center"><div style="width:96px;height:64px;background:var(--smaa-blue-050);border:2px solid var(--smaa-blue);border-radius:6px"></div><div class="lbl" style="margin-top:6px">--r-sm · 6px</div></div>
  <div style="text-align:center"><div style="width:96px;height:64px;background:var(--smaa-blue-050);border:2px solid var(--smaa-blue);border-radius:10px"></div><div class="lbl" style="margin-top:6px">--r-md · 10px</div></div>
  <div style="text-align:center"><div style="width:96px;height:64px;background:var(--smaa-blue-050);border:2px solid var(--smaa-blue);border-radius:16px"></div><div class="lbl" style="margin-top:6px">--r-lg · 16px</div></div>
  <div style="text-align:center"><div style="width:120px;height:40px;background:var(--smaa-blue-050);border:2px solid var(--smaa-blue);border-radius:999px"></div><div class="lbl" style="margin-top:6px">--r-pill · 999px</div></div>
