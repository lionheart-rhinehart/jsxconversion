<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--paper-soft);color:var(--fg1)}
.lbl{font-size:11px;color:var(--fg3);font-family:ui-monospace,monospace}

.eyebrow{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:13px;color:var(--smaa-blue)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--smaa-green-050);color:var(--smaa-green-600);font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px}
.item{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--fg1);font-weight:500}
.chk{color:var(--smaa-green);font-weight:800;flex:none}

</style></head><body>
<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
  <span class="eyebrow">Meet Our Team</span>
  <span class="pill">★ 5.0 Rated</span>
</div>
<div style="display:flex;flex-direction:column;gap:9px">
  <div class="item"><span class="chk">✓</span> Individual attention in small-group training</div>
  <div class="item"><span class="chk">✓</span> Caring, certified coaches</div>
  <div class="item"><span class="chk">✓</span> Confidence through real development</div>
</div>
<div class="lbl" style="margin-top:12px">Eyebrow · pill badge · green check benefit list</div></body></html>
