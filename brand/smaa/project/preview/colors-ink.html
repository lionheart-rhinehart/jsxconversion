<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;font-family:var(--font-sans);background:#fff;color:var(--fg1)}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column;gap:6px}
.sw{height:84px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.meta{font-size:12px;color:var(--fg3);font-family:var(--font-sans)}
.name{font-size:13px;font-weight:700;color:var(--fg1)}
.hex{font-family:ui-monospace,monospace;font-size:12px;color:var(--fg2)}

</style></head><body>
<div class="row">
  <div class="col" style="flex:1"><div class="sw" style="background:var(--ink-900)">Ink 900</div><div class="hex">#0b1219</div></div>
  <div class="col" style="flex:1"><div class="sw" style="background:var(--ink-800)">Ink 800</div><div class="hex">#121b24</div></div>
  <div class="col" style="flex:1"><div class="sw" style="background:var(--ink-700)">Ink 700</div><div class="hex">#1d2933</div></div>
  <div class="col" style="flex:1"><div class="sw" style="background:var(--paper-soft);color:var(--fg2);border:1px solid var(--paper-line)">Soft</div><div class="hex">#f4f7fa</div></div>
</div>
<div class="meta" style="margin-top:12px">Dark sections &amp; the home for the white logo. White (#ffffff) is the dominant light surface.</div></body></html>
