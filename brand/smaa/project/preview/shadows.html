<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:var(--font-sans);background:#fff;color:var(--fg1)}
.lbl{font-size:11px;color:var(--fg3);font-family:ui-monospace,monospace}
.box{width:150px;height:84px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--fg3)}
</style></head><body>
<div style="display:flex;gap:26px;background:var(--paper-soft);padding:24px;border-radius:12px">
  <div style="text-align:center"><div class="box" style="box-shadow:var(--shadow-sm)">sm</div><div class="lbl" style="margin-top:8px">--shadow-sm</div></div>
  <div style="text-align:center"><div class="box" style="box-shadow:var(--shadow-md)">md</div><div class="lbl" style="margin-top:8px">--shadow-md</div></div>
  <div style="text-align:center"><div class="box" style="box-shadow:var(--shadow-cta);background:var(--smaa-blue);color:#fff">cta glow</div><div class="lbl" style="margin-top:8px">--shadow-cta</div></div>
</div></body></html>
