<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:var(--font-sans)}
.wrap{display:flex;align-items:center;gap:0}
.dark{flex:1;background:var(--ink-900);padding:30px 28px;display:flex;align-items:center;justify-content:center;min-height:150px}
.dark img{width:88%;max-width:380px}
.note{width:230px;padding:22px;background:#fff}
.note .lbl{font-size:11px;color:var(--fg3);font-family:ui-monospace,monospace;margin-top:4px}
</style></head><body>
<div class="wrap">
  <div class="dark"><img src="../assets/logo.webp" alt="SMAA logo"></div>
  <div class="note">
    <div style="font-weight:800;font-size:15px">Primary logo</div>
    <div style="font-size:13px;color:var(--fg2);line-height:1.5;margin-top:6px">White wordmark + Maine state outline. Transparent background — always place on navy/ink or over imagery.</div>
    <div class="lbl">assets/logo.webp</div>
  </div>
</div>
</body></html>
