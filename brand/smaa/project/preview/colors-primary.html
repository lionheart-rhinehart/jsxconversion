<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;font-family:var(--font-sans);background:#fff;color:var(--fg1)}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column;gap:6px}
.sw{height:84px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.meta{font-size:12px;color:var(--fg3);font-family:var(--font-sans)}
.name{font-size:13px;font-weight:700;color:var(--fg1)}
.hex{font-family:ui-monospace,monospace;font-size:12px;color:var(--fg2)}

</style></head><body>
<div class="row">
  <div class="col" style="flex:2">
    <div class="sw" style="background:var(--smaa-blue)">Primary</div>
    <div class="name">Electric Blue</div><div class="hex">#017ee6 · --smaa-blue</div>
  </div>
  <div class="col" style="flex:1">
    <div class="sw" style="background:var(--smaa-blue-600)">Hover</div>
    <div class="hex">#0268bd</div>
  </div>
  <div class="col" style="flex:1">
    <div class="sw" style="background:var(--smaa-blue-050);color:var(--smaa-blue)">Tint</div>
    <div class="hex">#e6f3fd</div>
  </div>
</div></body></html>
