<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;font-family:var(--font-sans);background:#fff;color:var(--fg1)}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column;gap:6px}
.sw{height:84px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.meta{font-size:12px;color:var(--fg3);font-family:var(--font-sans)}
.name{font-size:13px;font-weight:700;color:var(--fg1)}
.hex{font-family:ui-monospace,monospace;font-size:12px;color:var(--fg2)}

</style></head><body>
<div class="row">
  <div class="col" style="flex:1;background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:14px">
    <div style="color:var(--fg1);font-weight:700">Primary on light · --fg1</div>
    <div style="color:var(--fg2);font-weight:500;margin-top:4px">Secondary · --fg2</div>
    <div style="color:var(--fg3);margin-top:4px">Muted caption · --fg3</div>
  </div>
  <div class="col" style="flex:1;background:var(--ink-900);border-radius:12px;padding:14px">
    <div style="color:var(--fg-on-dark1);font-weight:700">Primary on dark</div>
    <div style="color:var(--fg-on-dark2);font-weight:500;margin-top:4px">Secondary on dark</div>
    <div style="color:var(--smaa-blue);font-weight:600;margin-top:4px">Link · --link</div>
  </div>
</div></body></html>
