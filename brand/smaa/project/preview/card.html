<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--paper-soft);color:var(--fg1)}
.lbl{font-size:11px;color:var(--fg3);font-family:ui-monospace,monospace}

.card{background:#fff;border-radius:16px;box-shadow:var(--shadow-md);overflow:hidden;width:320px}
.card .pad{padding:20px}
.step{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--smaa-blue);font-weight:600}

</style></head><body>
<div class="card">
  <div style="height:120px;background:url('../assets/step1.webp') center/cover"></div>
  <div class="pad">
    <div class="step">Step 1</div>
    <div style="font-weight:800;font-size:19px;margin:4px 0 6px">Schedule a Gameplan Session</div>
    <div style="font-size:14px;line-height:1.55;color:var(--fg2)">A personalized 45-minute evaluation to see if SMAA is the right fit.</div>
  </div>
</div>
<div class="lbl" style="margin-top:12px">Content card · 16px radius · soft shadow · photo + body</div></body></html>
