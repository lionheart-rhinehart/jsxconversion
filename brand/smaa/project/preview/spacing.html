<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:var(--font-sans);background:#fff;color:var(--fg1)}
.lbl{font-size:11px;color:var(--fg3);font-family:ui-monospace,monospace}
.bar{background:var(--smaa-green);height:16px;border-radius:3px}
</style></head><body>
<div style="display:flex;flex-direction:column;gap:8px">
  
  <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="width:4px"></div><span class="lbl">--sp-1 · 4px</span></div>
  <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="width:8px"></div><span class="lbl">--sp-2 · 8px</span></div>
  <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="width:12px"></div><span class="lbl">--sp-3 · 12px</span></div>
  <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="width:16px"></div><span class="lbl">--sp-4 · 16px</span></div>
  <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="width:24px"></div><span class="lbl">--sp-5 · 24px</span></div>
  <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="width:32px"></div><span class="lbl">--sp-6 · 32px</span></div>
  <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="width:48px"></div><span class="lbl">--sp-7 · 48px</span></div>
  <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="width:64px"></div><span class="lbl">--sp-8 · 64px</span></div>
</div>
<div class="lbl" style="margin-top:10px">4px base scale · section rhythm 64–96px</div></body></html>
