<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Power Source — Multi-Sport FB/IG Story Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800;900&family=Saira:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="campaign-ads.css" />
<style>
  html, body { margin: 0; background: var(--ink-950); }

  /* ============================================================
     CANVAS PAGE CHROME
     ============================================================ */
  .pageHead { padding: 40px 48px 8px; color: var(--text-strong); }
  .pageHead h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 40px; letter-spacing: -.01em; margin: 0 0 8px; }
  .pageHead h1 .hl { color: var(--bolt-400); }
  .pageHead p { font-family: var(--font-mono); font-size: 14px; letter-spacing: .04em; color: var(--text-muted); margin: 0; max-width: 80ch; line-height: 1.6; }

  /* ---------- gallery ---------- */
  .galSec { padding: 28px 48px 8px; }
  .galSec__head { border-top: 1px solid var(--border-subtle); padding-top: 24px; margin-bottom: 22px; }
  .galSec__head h2 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 26px; letter-spacing: -.005em; color: var(--text-strong); margin: 0 0 4px; }
  .galSec__head p { font-family: var(--font-heading); font-size: 15px; color: var(--text-muted); margin: 0; }
  .gal { display: flex; flex-wrap: wrap; gap: 28px; }
  .gcard { display: flex; flex-direction: column; gap: 12px; margin: 0; }
  .thumb { position: relative; width: 340px; height: 604px; border-radius: 14px; overflow: hidden; cursor: pointer; outline: 1px solid var(--border-subtle); box-shadow: var(--shadow-lg); transition: outline-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }
  .thumb:hover { outline: 2px solid var(--electric-400); transform: translateY(-3px); }
  .thumb__scale { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; transform: scale(.31481); transform-origin: top left; }
  .thumb__expand { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 12px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #fff; text-align: center; background: linear-gradient(to top, rgba(5,6,8,.85), transparent); opacity: 0; transition: opacity var(--dur-base) var(--ease-out); }
  .thumb:hover .thumb__expand { opacity: 1; }
  .gcard__cap { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .gcard__cap b { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: 17px; color: var(--text-strong); }
  .gcard__cap span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--text-muted); }

  /* ---------- lightbox ---------- */
  .lb { position: fixed; inset: 0; z-index: 1000; background: rgba(5,6,8,.94); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; gap: 8px; animation: lbfade var(--dur-base) var(--ease-out); }
  @keyframes lbfade { from { opacity: 0; } }
  .lb__col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .lb__stage { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-xl); }
  .lb__cap { display: flex; align-items: baseline; gap: 14px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--text-muted); }
  .lb__cap b { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: 16px; letter-spacing: .02em; color: #fff; }
  .lb__nav { width: 56px; height: 56px; flex: 0 0 auto; border-radius: 50%; border: 1px solid var(--border-default); background: rgba(255,255,255,.06); color: #fff; font-size: 30px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--dur-fast) var(--ease-out); }
  .lb__nav:hover { background: rgba(255,255,255,.16); }
  .lb__close { position: absolute; top: 22px; right: 26px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--border-default); background: rgba(255,255,255,.06); color: #fff; font-size: 18px; cursor: pointer; }
  .lb__close:hover { background: rgba(255,255,255,.16); }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#070a10"/>
    <path d="M58 18 L34 54 H50 L42 82 L70 40 H53 Z" fill="#e1cc42"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="campaign-ads.jsx"></script>
<script type="text/babel">
  const {
    Ad_Speed_Photo, Ad_Speed_Type, Ad_Conf_Photo,
    Ad_Conf_Type, Ad_Believe_Photo, Ad_Believe_Type,
  } = window;
  const { useState, useEffect } = React;

  const SECTIONS = [
    { title: "Angle 1 · Speed", sub: "“Why hard work isn’t enough” — the kid who works hard but isn’t getting faster",
      ads: [
        { id: "1A", label: "1A · Photo-led", note: "Specified headline", Comp: Ad_Speed_Photo },
        { id: "1B", label: "1B · Type-led", note: "Punchy ALL-CAPS alt + 224% proof", Comp: Ad_Speed_Type },
      ] },
    { title: "Angle 2 · Confidence (proof)", sub: "“Why ‘great job’ isn’t working” — confidence built on data, not praise",
      ads: [
        { id: "2A", label: "2A · Photo-led", note: "Specified headline", Comp: Ad_Conf_Photo },
        { id: "2B", label: "2B · Type-led", note: "Punchy ALL-CAPS alt + scoreboard", Comp: Ad_Conf_Type },
      ] },
    { title: "Angle 3 · Confidence (emotional)", sub: "“When they stop believing” — the warmer, story-led cut",
      ads: [
        { id: "3A", label: "3A · Photo-led", note: "Specified headline", Comp: Ad_Believe_Photo },
        { id: "3B", label: "3B · Type-led", note: "Punchy ALL-CAPS alt + parent quote", Comp: Ad_Believe_Type },
      ] },
  ];
  const ALL = SECTIONS.flatMap((s) => s.ads);

  function Lightbox({ idx, onClose, onNav }) {
    const ad = ALL[idx];
    const [scale, setScale] = useState(0.4);
    useEffect(() => {
      const fit = () => setScale(Math.min((window.innerHeight - 120) / 1920, (window.innerWidth - 80) / 1080));
      fit(); window.addEventListener("resize", fit); return () => window.removeEventListener("resize", fit);
    }, []);
    useEffect(() => {
      const onKey = (e) => { if (e.key === "Escape") onClose(); if (e.key === "ArrowRight") onNav(1); if (e.key === "ArrowLeft") onNav(-1); };
      window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey);
    }, [onClose, onNav]);
    return (
      <div className="lb" onClick={onClose}>
        <button className="lb__nav lb__nav--prev" onClick={(e) => { e.stopPropagation(); onNav(-1); }} aria-label="Previous">‹</button>
        <div className="lb__col" onClick={(e) => e.stopPropagation()}>
          <div className="lb__stage" style={{ width: 1080 * scale, height: 1920 * scale }}>
            <div style={{ transform: `scale(${scale})`, transformOrigin: "top left" }}><ad.Comp /></div>
          </div>
          <div className="lb__cap"><b>{ad.label}</b><span>1080 × 1920 · {idx + 1} / {ALL.length}</span></div>
        </div>
        <button className="lb__nav lb__nav--next" onClick={(e) => { e.stopPropagation(); onNav(1); }} aria-label="Next">›</button>
        <button className="lb__close" onClick={onClose} aria-label="Close">✕</button>
      </div>
    );
  }

  function App() {
    const [open, setOpen] = useState(null);
    const nav = (d) => setOpen((i) => (i + d + ALL.length) % ALL.length);
    let running = -1;
    return (
      <React.Fragment>
        <div className="pageHead">
          <h1>Multi-Sport Foundation — <span className="hl">FB / IG Story Ads</span></h1>
          <p>3 angles × 2 directions · 1080×1920 (9:16) · real Power Source footage. Photo-led uses the brief’s headline; type-led uses a punchier ALL-CAPS brand alternate. Click any creative to view it full size (← → to flip, Esc to close).</p>
        </div>
        {SECTIONS.map((s) => (
          <section className="galSec" key={s.title}>
            <div className="galSec__head">
              <h2>{s.title}</h2>
              <p>{s.sub}</p>
            </div>
            <div className="gal">
              {s.ads.map((a) => {
                running += 1; const idx = running;
                return (
                  <figure className="gcard" key={a.id}>
                    <div className="thumb" onClick={() => setOpen(idx)}>
                      <div className="thumb__scale"><a.Comp /></div>
                      <span className="thumb__expand">⤢ View full size</span>
                    </div>
                    <figcaption className="gcard__cap"><b>{a.label}</b><span>{a.note}</span></figcaption>
                  </figure>
                );
              })}
            </div>
          </section>
        ))}
        {open !== null && <Lightbox idx={open} onClose={() => setOpen(null)} onNav={nav} />}
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
