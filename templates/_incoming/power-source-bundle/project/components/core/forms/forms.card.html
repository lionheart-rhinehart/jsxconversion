<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../../styles.css" />
<style>
  body { background: var(--ink-950); margin: 0; padding: 26px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input } = window.PowerSourceDesignSystem_0cec65;
  function Demo() {
    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
    return (
      <div className="grid">
        <Input label="Athlete's name" required placeholder="First & last" />
        <Input label="Email" type="email" icon={<i data-lucide="mail"></i>} helper="We'll send your free sessions here." />
        <Input label="Phone" icon={<i data-lucide="phone"></i>} error="Enter a valid phone number." defaultValue="123" />
        <Input label="Disabled" placeholder="Unavailable" disabled />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
