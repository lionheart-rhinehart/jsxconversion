<!-- @dsCard group="Spacing" viewport="700x170" name="Radii" subtitle="Blocky, slightly hard-edged corners" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: var(--ink-900); padding: 22px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 76px; height: 56px; background: var(--surface-steel); border: 1.5px solid var(--electric-400); }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-none)"></div><div class="lab">none · 0</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab">sm · 4</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab">md · 8</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab">lg · 12</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab">xl · 18</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="lab">2xl · 24</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:56px"></div><div class="lab">pill</div></div>
  </div>
</body>
</html>
