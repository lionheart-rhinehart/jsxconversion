<!-- @dsCard group="Type" viewport="700x250" name="Headings — Saira" subtitle="H1–H4 UI heading scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: var(--ink-900); padding: 24px; }
  .line { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--border-subtle); padding: 10px 0; }
  .line:last-child { border-bottom: 0; }
  .spec { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); width: 96px; flex: none; }
  h1,h2,h3,h4 { color: var(--text-strong); font-family: var(--font-heading); }
  h1 { font-size: var(--fs-h1); font-weight: 700; }
  h2 { font-size: var(--fs-h2); font-weight: 700; }
  h3 { font-size: var(--fs-h3); font-weight: 600; }
  h4 { font-size: var(--fs-h4); font-weight: 600; }
</style>
</head>
<body>
  <div class="line"><span class="spec">H1 · 34 / 700</span><h1>Where every athlete is a champion</h1></div>
  <div class="line"><span class="spec">H2 · 27 / 700</span><h2>Personalized coaching that works</h2></div>
  <div class="line"><span class="spec">H3 · 22 / 600</span><h3>Speed, strength & conditioning</h3></div>
  <div class="line"><span class="spec">H4 · 18 / 600</span><h4>Meet your coach</h4></div>
</body>
</html>
