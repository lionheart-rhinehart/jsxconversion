<!-- @dsCard group="Colors" viewport="700x160" name="Semantic Status" subtitle="Success, warning, danger, info — with soft fills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: var(--ink-900); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 50px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .soft { height: 22px; border-radius: 0 0 var(--radius-md) var(--radius-md); margin-top: 0; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 8px; text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--success);color:#fff">Success</div><div class="soft" style="background:var(--success-soft)"></div><div class="name">--success</div></div>
    <div class="sw"><div class="chip" style="background:var(--warning);color:var(--ink-950)">Warning</div><div class="soft" style="background:var(--warning-soft)"></div><div class="name">--warning</div></div>
    <div class="sw"><div class="chip" style="background:var(--danger);color:#fff">Danger</div><div class="soft" style="background:var(--danger-soft)"></div><div class="name">--danger</div></div>
    <div class="sw"><div class="chip" style="background:var(--info);color:#fff">Info</div><div class="soft" style="background:var(--info-soft)"></div><div class="name">--info</div></div>
  </div>
</body>
</html>
