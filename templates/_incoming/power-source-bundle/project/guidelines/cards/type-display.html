<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: var(--ink-950); padding: 26px; }
  .head { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; color: var(--text-strong); line-height: .9; letter-spacing: -.01em; }
  .xl { font-size: 64px; }
  .lg { font-size: 40px; color: var(--text-muted); }
  .bolt { color: var(--bolt-400); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 16px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="head xl">Train Hard.<br><span class="bolt">Rise Higher.</span></div>
  <div class="head lg">Compete Stronger</div>
  <div class="meta">Saira Condensed · 800 · uppercase · line-height .9 · tracking −0.01em</div>
</body>
</html>
