<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals" subtitle="Ink (dark, navy-tinted) + cool grays" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: var(--ink-900); padding: 22px; }
  .grp { margin-bottom: 14px; }
  .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 7px; }
  .scale { display: flex; gap: 6px; }
  .step { flex: 1; }
  .bar { height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
  .lab { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); margin-top: 5px; text-align: center; }
</style>
</head>
<body>
  <div class="grp">
    <div class="tag">Ink — dark surfaces</div>
    <div class="scale">
      <div class="step"><div class="bar" style="background:var(--ink-950)"></div><div class="lab">950</div></div>
      <div class="step"><div class="bar" style="background:var(--ink-900)"></div><div class="lab">900</div></div>
      <div class="step"><div class="bar" style="background:var(--ink-850)"></div><div class="lab">850</div></div>
      <div class="step"><div class="bar" style="background:var(--ink-800)"></div><div class="lab">800</div></div>
      <div class="step"><div class="bar" style="background:var(--ink-700)"></div><div class="lab">700</div></div>
      <div class="step"><div class="bar" style="background:var(--ink-600)"></div><div class="lab">600</div></div>
      <div class="step"><div class="bar" style="background:var(--ink-500)"></div><div class="lab">500</div></div>
    </div>
  </div>
  <div class="grp">
    <div class="tag">Gray — light UI</div>
    <div class="scale">
      <div class="step"><div class="bar" style="background:var(--gray-50)"></div><div class="lab">50</div></div>
      <div class="step"><div class="bar" style="background:var(--gray-100)"></div><div class="lab">100</div></div>
      <div class="step"><div class="bar" style="background:var(--gray-200)"></div><div class="lab">200</div></div>
      <div class="step"><div class="bar" style="background:var(--gray-300)"></div><div class="lab">300</div></div>
      <div class="step"><div class="bar" style="background:var(--gray-400)"></div><div class="lab">400</div></div>
      <div class="step"><div class="bar" style="background:var(--gray-500)"></div><div class="lab">500</div></div>
      <div class="step"><div class="bar" style="background:var(--gray-600)"></div><div class="lab">600</div></div>
      <div class="step"><div class="bar" style="background:var(--gray-700)"></div><div class="lab">700</div></div>
      <div class="step"><div class="bar" style="background:var(--gray-800)"></div><div class="lab">800</div></div>
      <div class="step"><div class="bar" style="background:var(--gray-900)"></div><div class="lab">900</div></div>
    </div>
  </div>
</body>
</html>
