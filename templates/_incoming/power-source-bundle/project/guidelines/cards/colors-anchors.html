<!-- @dsCard group="Colors" viewport="700x190" name="Brand Anchors" subtitle="The five official Power Source colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: var(--ink-900); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 76px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
  .name { margin-top: 10px; font-family: var(--font-heading); font-weight: 700; font-size: 13px; color: var(--text-strong); text-transform: uppercase; letter-spacing: .04em; }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#ffffff"></div><div class="name">White</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:#e1cc42"></div><div class="name">Bolt</div><div class="hex">#E1CC42</div></div>
    <div class="sw"><div class="chip" style="background:#2c97c9"></div><div class="name">Electric</div><div class="hex">#2C97C9</div></div>
    <div class="sw"><div class="chip" style="background:#31456e"></div><div class="name">Steel</div><div class="hex">#31456E</div></div>
    <div class="sw"><div class="chip" style="background:#010101"></div><div class="name">Black</div><div class="hex">#010101</div></div>
  </div>
</body>
</html>
